<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>usabl late mount fixture</title>
  </head>
  <body>
    <main id="root">
      <h1>Late mount fixture</h1>
    </main>
    <script>
      // Stands in for a client-rendered application: the DOM keeps growing after the network is
      // already quiet, so a readiness wait that only watches the network reads an empty page.
      (() => {
        const root = document.getElementById('root');
        const mount = (count, from) => {
          for (let index = 0; index < count; index += 1) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'mounted';
            button.textContent = 'Row ' + (from + index);
            root?.appendChild(button);
          }
        };
        setTimeout(() => mount(3, 1), 400);
        setTimeout(() => mount(101, 4), 1200);
      })();
    </script>
  </body>
</html>
