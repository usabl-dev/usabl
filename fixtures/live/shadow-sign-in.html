<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users</title>
  </head>
  <body>
    <main>
      <h1>Log in to your account</h1>
      <sign-in-form></sign-in-form>
    </main>
    <script>
      // The login form lives inside an open shadow root at the requested address. Nothing about
      // the URL changed and document.querySelectorAll finds no password input, so only a probe
      // that pierces shadow roots can see it.
      customElements.define(
        'sign-in-form',
        class extends HTMLElement {
          connectedCallback() {
            const root = this.attachShadow({ mode: 'open' });
            root.innerHTML =
              '<form>' +
              '<label for="email">Email</label>' +
              '<input id="email" name="email" type="email" />' +
              '<label for="password">Password</label>' +
              '<input id="password" name="password" type="password" />' +
              '<button type="submit">Log in</button>' +
              '</form>';
          }
        },
      );
    </script>
  </body>
</html>
