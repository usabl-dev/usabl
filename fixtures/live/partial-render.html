<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders</title>
  </head>
  <body>
    <header>
      <nav aria-label="Main">
        <a id="home-link" href="#home">Home</a>
      </nav>
    </header>
    <main id="root">
      <h1>Orders</h1>
    </main>
    <script>
      // The header, the navigation, and the heading always mount. The screen's own content, a
      // table of orders, mounts only when ?content=ok or ?content=broken. With ?content=fail its
      // component throws before it renders anything, which is what a failed mount looks like from
      // outside. With ?content=broken the table mounts with the barriers a floor would record:
      // each row's button, link, and image has no accessible name. With ?content=ok they are fixed.
      const content = new URLSearchParams(location.search).get('content');
      const named = content === 'ok';
      const mountOrders = () => {
        if (content !== 'ok' && content !== 'broken') {
          throw new Error('orders failed to mount');
        }
        const table = document.createElement('table');
        table.id = 'orders';
        const caption = document.createElement('caption');
        caption.textContent = 'Open orders';
        table.appendChild(caption);
        const body = document.createElement('tbody');
        for (const order of ['A-100', 'A-101']) {
          const row = document.createElement('tr');
          const cell = document.createElement('td');
          const button = document.createElement('button');
          button.type = 'button';
          if (named) button.textContent = 'Open ' + order;
          cell.appendChild(button);
          const link = document.createElement('a');
          link.href = '#' + order;
          if (named) link.textContent = 'Details for ' + order;
          cell.appendChild(link);
          const image = document.createElement('img');
          image.src = 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
          image.width = 16;
          image.height = 16;
          if (named) image.alt = 'Status of ' + order;
          cell.appendChild(image);
          row.appendChild(cell);
          body.appendChild(row);
        }
        table.appendChild(body);
        document.getElementById('root')?.appendChild(table);
      };
      try {
        mountOrders();
      } catch {
        // Swallowed, the way an error boundary that renders nothing swallows it.
      }
    </script>
  </body>
</html>
