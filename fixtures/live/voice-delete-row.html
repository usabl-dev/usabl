<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>usabl voice contract fixture</title>
  </head>
  <body>
    <main>
      <h1>Rows</h1>
      <table>
        <tbody>
          <tr data-row="a">
            <td>Row A</td>
            <td><button type="button" aria-label="Delete">X</button></td>
          </tr>
        </tbody>
      </table>
      <button type="button" id="undo">Undo delete</button>
      <div role="status" id="message"></div>
    </main>
    <script>
      // Deleting a row moves focus to the undo control at once and announces the deletion in a
      // polite region after ?delay= milliseconds (0 when absent). Writing text into the existing
      // region adds no element, so the late update does not move the element count.
      (() => {
        const delay = Number(new URLSearchParams(location.search).get('delay') ?? '0');
        const announce = () => {
          document.getElementById('message').textContent = 'Row deleted';
        };
        document.querySelector('[data-row="a"] button').addEventListener('click', () => {
          document.getElementById('undo').focus();
          if (delay > 0) {
            setTimeout(announce, delay);
          } else {
            announce();
          }
        });
      })();
    </script>
  </body>
</html>
