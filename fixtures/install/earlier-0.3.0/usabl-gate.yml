name: usabl-gate
# Each run is named after the event, pull request, head, and base that started it, so a review can
# find the build of this exact pull request even when another pull request has the same head.
run-name: usabl-gate ${{ github.event_name }} pr ${{ github.event.pull_request.number }} head ${{ github.event.pull_request.head.repo.full_name }}@${{ github.event.pull_request.head.sha }} base ${{ github.event.pull_request.base.sha }}

on:
  pull_request:
    branches: [main]
    # Retargeting onto main must re-run trusted-ref policy checks.
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    # Use the event payload so a review still knows the base branch and head SHA.
    types: [submitted, edited, dismissed]

permissions:
  contents: read

# Who may run what. Only build-app runs pull request code, and it holds no secret. A job that
# runs head code on a hosted runner has sudo, so it may be able to read the runner's own token
# and upload, delete, or replace artifacts in this run. So no trusted job believes an artifact
# by its name: each one checks what it downloads against a digest from a job output, which only
# the producing job's own steps can set. No trusted job unpacks an artifact with
# actions/download-artifact, whose zip extraction follows .. inside entry names; each fetches the
# zip through the REST API and reads it with usabl's own fetcher, which accepts only the expected
# file. No trusted job uses a cache, because a cache can be written by pull request code.
# merge_group is not supported; a missing required check blocks.
jobs:
  usabl-engine:
    # The trusted engine, built from the pinned commit and handed to every other job as a
    # digest-checked archive. It runs no pull request code. The engine repository is public, so
    # this job needs no token and a pull request from a fork runs the gate like any other.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      engine_digest: ${{ steps.pack.outputs.engine_digest }}
      engine_tree_digest: ${{ steps.pack.outputs.engine_tree_digest }}
    steps:
      - name: Checkout trusted usabl engine commit
        # A full commit SHA you trust. The pull request never chooses the engine that judges it.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: usabl-dev/usabl
          ref: PIN_TO_A_TRUSTED_USABL_COMMIT
          path: usabl-engine
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          # setup-node turns npm caching on by itself when package.json names npm. A cache can be
          # written by pull request code, so every job turns it off by name.
          package-manager-cache: false

      - name: Install and build trusted engine
        working-directory: usabl-engine
        run: |
          # A fresh npm cache under the runner temp directory, never one a pull request could seed.
          export npm_config_cache="${RUNNER_TEMP}/usabl-npm-cache"
          npm ci
          npm run build
          # Keep only what the engine needs at run time, so no later job runs npm for it.
          npm prune --omit=dev

      - name: Pack trusted engine
        id: pack
        working-directory: usabl-engine
        run: |
          # package.json, dist, and the production node_modules the lockfile pinned. The .git
          # directory and the sources stay out.
          tar --create --gzip --file "${RUNNER_TEMP}/usabl-engine.tgz" --exclude=.git --exclude=node_modules/.bin package.json dist node_modules
          echo "engine_digest=$(sha256sum "${RUNNER_TEMP}/usabl-engine.tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          # The digest of the tree a job gets when it unpacks this archive. Each trusted job checks
          # its unpacked engine against it right before it runs the engine.
          mkdir "${RUNNER_TEMP}/usabl-engine-tree"
          tar --extract --gzip --no-same-owner --file "${RUNNER_TEMP}/usabl-engine.tgz" --directory "${RUNNER_TEMP}/usabl-engine-tree"
          echo "engine_tree_digest=$(cd "${RUNNER_TEMP}/usabl-engine-tree" && { find . -mindepth 1 -printf '%y %p %l\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum; } | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload trusted engine
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usabl-engine
          path: ${{ runner.temp }}/usabl-engine.tgz
          if-no-files-found: error
          retention-days: 1

  build-app:
    # UNTRUSTED. This is the only job that runs pull request code, so it is fenced to the
    # pull_request event, holds no secret, and has a read-only token. Its build_digest output is
    # the head's own word: the judge checks the archive against it on this event and records the
    # digest it scanned in the Result, which binds the verdict to those exact bytes.
    if: github.event_name == 'pull_request'
    needs: usabl-engine
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build_digest: ${{ steps.pack.outputs.build_digest }}
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          # setup-node turns npm caching on by itself when package.json names npm. A cache can be
          # written by pull request code, so every job turns it off by name.
          package-manager-cache: false

      - name: Download the engine
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: usabl-engine
          path: ${{ runner.temp }}/usabl-download-engine

      - name: Install the engine where the app expects it
        working-directory: ${{ runner.temp }}
        env:
          ENGINE_DIGEST: ${{ needs.usabl-engine.outputs.engine_digest }}
          DOWNLOAD_DIR: ${{ runner.temp }}/usabl-download-engine
        run: |
          if ! [[ "${ENGINE_DIGEST}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "the expected engine digest is not a sha256 hex string; failing closed"
            exit 1
          fi
          if [ "$(ls -A "${DOWNLOAD_DIR}")" != "usabl-engine.tgz" ] || [ -L "${DOWNLOAD_DIR}/usabl-engine.tgz" ] || [ ! -f "${DOWNLOAD_DIR}/usabl-engine.tgz" ]; then
            echo "the engine artifact is not exactly one regular file named usabl-engine.tgz; failing closed"
            exit 1
          fi
          printf '%s  %s\n' "${ENGINE_DIGEST}" "${DOWNLOAD_DIR}/usabl-engine.tgz" | sha256sum -c -
          # This places the engine in ../usabl for an app whose lockfile installs usabl from file:../usabl.
          # An app that does not use that path never reads the folder, so for that app this step does
          # not change what npm ci installs or what the build makes.
          mkdir -p "${GITHUB_WORKSPACE}/../usabl"
          tar --extract --gzip --no-same-owner --file "${DOWNLOAD_DIR}/usabl-engine.tgz" --directory "${GITHUB_WORKSPACE}/../usabl"

      - name: Install app dependencies
        run: npm ci --ignore-scripts

      - name: Build the app
        env:
          APP_BUILD_COMMAND: ${{ vars.USABL_APP_BUILD_COMMAND }}
        run: |
          # This is pull request code. It runs here and nowhere else.
          bash -c "${APP_BUILD_COMMAND:-npm run build}"

      - name: Pack the build
        id: pack
        env:
          APP_BUILD_DIR: ${{ vars.USABL_APP_BUILD_DIR }}
        run: |
          build_dir="${APP_BUILD_DIR:-dist}"
          if [ ! -d "${build_dir}" ]; then
            echo "the build produced no ${build_dir} directory; set USABL_APP_BUILD_DIR if it writes elsewhere"
            exit 1
          fi
          tar --create --exclude=./.usabl --file "${RUNNER_TEMP}/usabl-app-build.tar" --directory "${build_dir}" .
          echo "build_digest=$(sha256sum "${RUNNER_TEMP}/usabl-app-build.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usabl-app-build
          path: ${{ runner.temp }}/usabl-app-build.tar
          if-no-files-found: error
          # Kept a week so an approval days later can still be re-judged.
          retention-days: 7

  usabl-scan:
    # THE TRUSTED JUDGE. It decides the accessibility verdict and runs on both events, so a
    # review re-judges the same head. It never runs head code in Node or a shell. The head is
    # checked out as data into head/. The engine comes from the verified usabl-engine archive and
    # lives under the runner temp directory, outside the head tree, so nothing the head commits,
    # such as a node_modules directory or an .npmrc, can be resolved by it. The head's build runs
    # only as page script, in a sandboxed Chromium whose requests are filtered to the trusted
    # origins. It references no secret and uses no cache.
    needs: [usabl-engine, build-app]
    if: >-
      always() && needs.usabl-engine.result == 'success' &&
      ((github.event_name == 'pull_request' && needs.build-app.result == 'success') ||
      (github.event_name == 'pull_request_review' && needs.build-app.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only the review path uses this: it finds this head's pull_request run and downloads its build.
      actions: read
    outputs:
      # The accessibility verdict travels to usabl-required as a job output, which only this
      # job's steps can set. It starts at fail and only a clean enforce moves it to pass.
      verdict: ${{ steps.verdict.outputs.verdict }}
      result_digest: ${{ steps.verdict.outputs.result_digest }}
    env:
      # The base commit the event names. Serving, scanning, policy, and the comment all read this
      # one commit, so a base branch that moves during the run cannot mix two snapshots.
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ENGINE_TREE_DIGEST: ${{ needs.usabl-engine.outputs.engine_tree_digest }}
    steps:
      - name: Checkout pull request head as data
        # Nothing in this tree is executed. It is read for the diff against the trusted base.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          # setup-node turns npm caching on by itself when package.json names npm. A cache can be
          # written by pull request code, so every job turns it off by name.
          package-manager-cache: false

      - name: Write the artifact fetcher
        working-directory: ${{ runner.temp }}
        run: |
          # usabl's own artifact fetcher, Node builtins only. No trusted job extracts an artifact
          # with actions/download-artifact, whose zip extraction follows .. inside entry names.
          set -o noclobber
          cat > "${RUNNER_TEMP}/usabl-fetch-artifact.cjs" <<'NODE'
          'use strict';
          // usabl artifact fetcher. Node builtins only. It refuses an artifact rather than repair it.
          const fs = require('node:fs');
          const fsp = require('node:fs/promises');
          const path = require('node:path');
          const zlib = require('node:zlib');
          const { Readable, Transform } = require('node:stream');
          const { pipeline } = require('node:stream/promises');

          class Refusal extends Error {}
          function refuse(message) {
            throw new Refusal(message);
          }

          const CRC_TABLE = new Int32Array(256).map((_, n) => {
            let c = n;
            for (let k = 0; k < 8; k += 1) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
            return c;
          });
          function crc32(chunk, previous) {
            if (typeof zlib.crc32 === 'function') return zlib.crc32(chunk, previous);
            let c = previous ^ -1;
            for (let i = 0; i < chunk.length; i += 1) c = CRC_TABLE[(c ^ chunk[i]) & 0xff] ^ (c >>> 8);
            return (c ^ -1) >>> 0;
          }

          function isLoopback(hostname) {
            return hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '[::1]';
          }

          function settings(env) {
            const name = env.ARTIFACT_NAME || '';
            if (!/^[a-z0-9][a-z0-9-]*$/.test(name)) refuse('ARTIFACT_NAME is not a plain artifact name');
            const members = (env.ARTIFACT_MEMBERS || '').split(',');
            for (const member of members) {
              if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(member) || member.includes('..')) {
                refuse('ARTIFACT_MEMBERS must list plain file names');
              }
            }
            if (new Set(members).size !== members.length) refuse('ARTIFACT_MEMBERS lists a name twice');
            const runId = env.ARTIFACT_RUN_ID || '';
            if (!/^[0-9]+$/.test(runId)) refuse('ARTIFACT_RUN_ID is not a run id');
            const maxBytes = Number(env.ARTIFACT_MAX_BYTES);
            if (!Number.isSafeInteger(maxBytes) || maxBytes <= 0) refuse('ARTIFACT_MAX_BYTES is not a byte count');
            const into = env.ARTIFACT_INTO || '';
            if (!path.isAbsolute(into) || path.resolve(into) !== into) refuse('ARTIFACT_INTO is not a plain absolute path');
            const workspace = env.GITHUB_WORKSPACE || '';
            if (workspace !== '') {
              const relative = path.relative(path.resolve(workspace), into);
              if (relative === '' || (!relative.startsWith('..') && !path.isAbsolute(relative))) {
                refuse('ARTIFACT_INTO must be outside the workspace');
              }
            }
            let api;
            try {
              api = new URL(env.GITHUB_API_URL || 'https://api.github.com');
            } catch {
              refuse('GITHUB_API_URL is not a URL');
            }
            if (api.protocol !== 'https:' && !(api.protocol === 'http:' && isLoopback(api.hostname))) {
              refuse('GITHUB_API_URL must be https');
            }
            const repository = env.GITHUB_REPOSITORY || '';
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) refuse('GITHUB_REPOSITORY is not owner/name');
            const token = env.GH_TOKEN || '';
            if (token === '') refuse('GH_TOKEN is empty');
            return { name, members, runId, maxBytes, into, api, repository, token };
          }

          function apiUrl(s, pathname) {
            return new URL(s.api.href.replace(/\/$/, '') + pathname);
          }

          function apiHeaders(s) {
            return {
              Accept: 'application/vnd.github+json',
              Authorization: 'Bearer ' + s.token,
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'usabl',
            };
          }

          async function findArtifact(s) {
            const url = apiUrl(s, '/repos/' + s.repository + '/actions/runs/' + s.runId + '/artifacts?per_page=100&name=' + encodeURIComponent(s.name));
            const response = await fetch(url, { headers: apiHeaders(s), redirect: 'error' });
            if (!response.ok) refuse('GitHub answered ' + response.status + ' when listing the artifacts of run ' + s.runId);
            const listing = await response.json();
            const artifacts = listing !== null && typeof listing === 'object' && Array.isArray(listing.artifacts) ? listing.artifacts : [];
            // An artifact replaced in the run keeps its name and gets a new id, so the newest one is the one
            // the run holds now. Its content is checked against a job output after this.
            const found = artifacts
              .filter((a) => a !== null && typeof a === 'object' && a.name === s.name && a.expired !== true && Number.isSafeInteger(a.id))
              .sort((a, b) => b.id - a.id);
            if (found.length === 0) refuse('run ' + s.runId + ' has no artifact named ' + s.name);
            const artifact = found[0];
            if (typeof artifact.size_in_bytes === 'number' && artifact.size_in_bytes > s.maxBytes) {
              refuse('the artifact is ' + artifact.size_in_bytes + ' bytes, over the limit of ' + s.maxBytes);
            }
            return artifact.id;
          }

          async function download(s, id, zipPath) {
            const first = await fetch(apiUrl(s, '/repos/' + s.repository + '/actions/artifacts/' + id + '/zip'), {
              headers: apiHeaders(s),
              redirect: 'manual',
            });
            let response = first;
            if (first.status >= 300 && first.status < 400) {
              const location = first.headers.get('location');
              if (location === null) refuse('GitHub redirected the artifact download nowhere');
              const target = new URL(location, s.api);
              if (target.protocol !== 'https:' && !(target.protocol === 'http:' && s.api.protocol === 'http:' && isLoopback(target.hostname))) {
                refuse('the artifact download was redirected to a URL that is not https');
              }
              if (first.body !== null) await first.body.cancel();
              // The storage URL is signed. The job token is never sent to it.
              response = await fetch(target, { redirect: 'error' });
            }
            if (!response.ok || response.body === null) refuse('the artifact download answered ' + response.status);
            const declared = Number(response.headers.get('content-length'));
            if (Number.isFinite(declared) && declared > s.maxBytes) refuse('the artifact zip is over the limit of ' + s.maxBytes + ' bytes');
            const out = await fsp.open(zipPath, 'wx', 0o600);
            let total = 0;
            try {
              for await (const chunk of Readable.fromWeb(response.body)) {
                total += chunk.length;
                if (total > s.maxBytes) refuse('the artifact zip is over the limit of ' + s.maxBytes + ' bytes');
                await out.write(chunk);
              }
            } finally {
              await out.close();
            }
          }

          async function readAt(handle, offset, length) {
            const buffer = Buffer.alloc(length);
            const { bytesRead } = await handle.read(buffer, 0, length, offset);
            if (bytesRead !== length) refuse('the artifact zip ends early');
            return buffer;
          }

          // Why an entry name is refused, or null when it is exactly one of the expected members.
          function nameRefusal(raw, members, seen) {
            let name;
            try {
              name = new TextDecoder('utf-8', { fatal: true }).decode(raw);
            } catch {
              return 'an entry name is not UTF-8';
            }
            const shown = JSON.stringify(name);
            if (name === '' || name.includes('\0')) return 'an entry has an empty or NUL name';
            if (name.startsWith('/') || name.startsWith('\\') || /^[A-Za-z]:/.test(name)) return 'entry ' + shown + ' is an absolute path';
            if (name.split(/[\\/]/).includes('..')) return 'entry ' + shown + ' has a .. segment';
            if (name.includes('/') || name.includes('\\')) return 'entry ' + shown + ' is a path, not one of the expected file names';
            if (!members.includes(name)) return 'entry ' + shown + ' is not an expected member (' + members.join(', ') + ')';
            if (seen.has(name)) return 'entry ' + shown + ' appears twice';
            return null;
          }

          async function readEntries(handle, s) {
            const size = (await handle.stat()).size;
            if (size < 22) refuse('the artifact is not a zip archive');
            const tailLength = Math.min(size, 22 + 0xffff);
            const tailStart = size - tailLength;
            const tail = await readAt(handle, tailStart, tailLength);
            let eocd = -1;
            for (let i = tail.length - 22; i >= 0; i -= 1) {
              if (tail.readUInt32LE(i) === 0x06054b50 && i + 22 + tail.readUInt16LE(i + 20) === tail.length) {
                eocd = i;
                break;
              }
            }
            if (eocd === -1) refuse('the artifact is not a zip archive');
            const eocdOffset = tailStart + eocd;
            const disk = tail.readUInt16LE(eocd + 4);
            const cdDisk = tail.readUInt16LE(eocd + 6);
            const onDisk = tail.readUInt16LE(eocd + 8);
            const total = tail.readUInt16LE(eocd + 10);
            const cdSize = tail.readUInt32LE(eocd + 12);
            const cdOffset = tail.readUInt32LE(eocd + 16);
            if (total === 0xffff || cdSize === 0xffffffff || cdOffset === 0xffffffff) refuse('zip64 archives are not accepted');
            if (eocdOffset >= 20 && (await readAt(handle, eocdOffset - 20, 4)).readUInt32LE(0) === 0x07064b50) {
              refuse('zip64 archives are not accepted');
            }
            if (disk !== 0 || cdDisk !== 0 || onDisk !== total) refuse('split zip archives are not accepted');
            if (total !== s.members.length) {
              refuse('the artifact has ' + total + ' entries, and it must hold exactly ' + s.members.join(', '));
            }
            if (cdOffset + cdSize !== eocdOffset || cdSize > 1024 * total) refuse('the zip central directory is malformed');
            const cd = await readAt(handle, cdOffset, cdSize);
            const entries = [];
            const seen = new Set();
            let p = 0;
            for (let i = 0; i < total; i += 1) {
              if (p + 46 > cd.length || cd.readUInt32LE(p) !== 0x02014b50) refuse('the zip central directory is malformed');
              const entry = {
                madeBy: cd.readUInt16LE(p + 4),
                flags: cd.readUInt16LE(p + 8),
                method: cd.readUInt16LE(p + 10),
                crc: cd.readUInt32LE(p + 16),
                compressedSize: cd.readUInt32LE(p + 20),
                size: cd.readUInt32LE(p + 24),
                diskStart: cd.readUInt16LE(p + 34),
                external: cd.readUInt32LE(p + 38),
                offset: cd.readUInt32LE(p + 42),
              };
              const nameLength = cd.readUInt16LE(p + 28);
              const end = p + 46 + nameLength + cd.readUInt16LE(p + 30) + cd.readUInt16LE(p + 32);
              if (end > cd.length) refuse('the zip central directory is malformed');
              entry.rawName = cd.subarray(p + 46, p + 46 + nameLength);
              const why = nameRefusal(entry.rawName, s.members, seen);
              if (why !== null) refuse(why);
              entry.name = entry.rawName.toString('utf8');
              seen.add(entry.name);
              if ((entry.flags & 0x2041) !== 0) refuse('entry ' + entry.name + ' is encrypted');
              if (entry.method !== 0 && entry.method !== 8) refuse('entry ' + entry.name + ' uses an unsupported compression method');
              if (entry.compressedSize === 0xffffffff || entry.size === 0xffffffff || entry.offset === 0xffffffff || entry.diskStart !== 0) {
                refuse('zip64 archives are not accepted');
              }
              const host = entry.madeBy >>> 8;
              const unixType = (entry.external >>> 16) & 0o170000;
              if (host === 3 && unixType !== 0 && unixType !== 0o100000) refuse('entry ' + entry.name + ' is not a regular file');
              if (host !== 3 && host !== 0) refuse('entry ' + entry.name + ' was made on a system whose file types are not checked');
              if ((entry.external & 0x10) !== 0) refuse('entry ' + entry.name + ' is a directory');
              if (entry.size > s.maxBytes) refuse('entry ' + entry.name + ' unpacks to ' + entry.size + ' bytes, over the limit of ' + s.maxBytes);
              if (entry.method === 0 && entry.compressedSize !== entry.size) refuse('entry ' + entry.name + ' has inconsistent sizes');
              if (entry.method === 8 && entry.compressedSize === 0) refuse('entry ' + entry.name + ' has inconsistent sizes');
              entries.push(entry);
              p = end;
            }
            if (p !== cd.length) refuse('the zip central directory is malformed');
            for (const entry of entries) {
              if (entry.offset + 30 > cdOffset) refuse('entry ' + entry.name + ' points outside the archive');
              const local = await readAt(handle, entry.offset, 30);
              const nameLength = local.readUInt16LE(26);
              const dataStart = entry.offset + 30 + nameLength + local.readUInt16LE(28);
              if (
                local.readUInt32LE(0) !== 0x04034b50 ||
                local.readUInt16LE(6) !== entry.flags ||
                local.readUInt16LE(8) !== entry.method ||
                dataStart + entry.compressedSize > cdOffset ||
                !(await readAt(handle, entry.offset + 30, nameLength)).equals(entry.rawName)
              ) {
                refuse('the local header of entry ' + entry.name + ' does not match the central directory');
              }
              if ((entry.flags & 0x8) === 0) {
                if (local.readUInt32LE(14) !== entry.crc || local.readUInt32LE(18) !== entry.compressedSize || local.readUInt32LE(22) !== entry.size) {
                  refuse('the local header of entry ' + entry.name + ' does not match the central directory');
                }
              }
              entry.dataStart = dataStart;
            }
            return entries;
          }

          async function extract(handle, entry, into) {
            const target = path.join(into, entry.name);
            const flags = fs.constants.O_WRONLY | fs.constants.O_CREAT | fs.constants.O_EXCL | fs.constants.O_NOFOLLOW;
            const out = await fsp.open(target, flags, 0o600);
            let written = 0;
            let crc = 0;
            const count = new Transform({
              transform(chunk, _encoding, done) {
                written += chunk.length;
                if (written > entry.size) {
                  done(new Refusal('entry ' + entry.name + ' unpacks to more than the ' + entry.size + ' bytes it declares'));
                  return;
                }
                crc = crc32(chunk, crc);
                done(null, chunk);
              },
            });
            if (entry.compressedSize === 0) {
              await out.close();
            } else {
              const source = handle.createReadStream({ start: entry.dataStart, end: entry.dataStart + entry.compressedSize - 1, autoClose: false });
              const stages = entry.method === 8 ? [source, zlib.createInflateRaw(), count] : [source, count];
              await pipeline(...stages, out.createWriteStream());
            }
            if (written !== entry.size || crc !== entry.crc) refuse('entry ' + entry.name + ' does not match its declared size and checksum');
          }

          async function main() {
            const s = settings(process.env);
            const zipPath = s.into + '.zip';
            let created = false;
            try {
              const id = await findArtifact(s);
              await download(s, id, zipPath);
              const handle = await fsp.open(zipPath, 'r');
              try {
                const entries = await readEntries(handle, s);
                // A fresh directory: mkdir refuses one that already exists.
                await fsp.mkdir(s.into, { mode: 0o700 });
                created = true;
                for (const entry of entries) await extract(handle, entry, s.into);
              } finally {
                await handle.close();
              }
              console.log('usabl: fetched ' + s.members.join(', ') + ' from artifact ' + s.name + ' into ' + s.into);
            } catch (error) {
              if (created) await fsp.rm(s.into, { recursive: true, force: true });
              throw error;
            } finally {
              await fsp.rm(zipPath, { force: true });
            }
          }

          main().catch((error) => {
            const what = error instanceof Refusal ? error.message : 'the fetch failed: ' + (error instanceof Error ? error.message : String(error));
            console.error('usabl: refusing the ' + (process.env.ARTIFACT_NAME || '') + ' artifact: ' + what + '; failing closed');
            process.exit(1);
          });
          NODE

      - name: Fetch, verify, and unpack the trusted engine
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: usabl-engine
          ARTIFACT_MEMBERS: usabl-engine.tgz
          ARTIFACT_RUN_ID: ${{ github.run_id }}
          ARTIFACT_MAX_BYTES: "536870912"
          ARTIFACT_INTO: ${{ runner.temp }}/usabl-download-engine
          ENGINE_DIGEST: ${{ needs.usabl-engine.outputs.engine_digest }}
          DOWNLOAD_DIR: ${{ runner.temp }}/usabl-download-engine
        run: |
          node "${RUNNER_TEMP}/usabl-fetch-artifact.cjs"
          if ! [[ "${ENGINE_DIGEST}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "the expected engine digest is not a sha256 hex string; failing closed"
            exit 1
          fi
          if [ "$(ls -A "${DOWNLOAD_DIR}")" != "usabl-engine.tgz" ] || [ -L "${DOWNLOAD_DIR}/usabl-engine.tgz" ] || [ ! -f "${DOWNLOAD_DIR}/usabl-engine.tgz" ]; then
            echo "the engine artifact is not exactly one regular file named usabl-engine.tgz; failing closed"
            exit 1
          fi
          printf '%s  %s\n' "${ENGINE_DIGEST}" "${DOWNLOAD_DIR}/usabl-engine.tgz" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/usabl-engine"
          tar --extract --gzip --no-same-owner --file "${DOWNLOAD_DIR}/usabl-engine.tgz" --directory "${RUNNER_TEMP}/usabl-engine"

      - name: Install Chromium for the judge
        working-directory: ${{ runner.temp }}/usabl-engine
        run: |
          if ! [[ "${ENGINE_TREE_DIGEST}" =~ ^[0-9a-f]{64}$ ]] || [ "$(cd "${RUNNER_TEMP}/usabl-engine" && { find . -mindepth 1 -printf '%y %p %l\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum; } | sha256sum | cut -d' ' -f1)" != "${ENGINE_TREE_DIGEST}" ]; then
            echo "the trusted engine tree is not the one the engine job packed; failing closed"
            exit 1
          fi
          node node_modules/playwright/cli.js install --with-deps chromium

      - name: Find this head's build
        working-directory: ${{ runner.temp }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: usabl-gate.yml
          WORKFLOW_NAME: usabl-gate
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # On pull_request the build is in this run.
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            if ! [[ "${GITHUB_RUN_ID}" =~ ^[0-9]+$ ]]; then
              echo "this run has no numeric run id; failing closed"
              exit 1
            fi
            echo "BUILD_RUN_ID=${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
            exit 0
          fi
          # The build runs only on pull_request. Take the newest completed pull_request run of this
          # exact pull request, head repository, head, and base, by its run name, whose latest
          # build-app job succeeded. Every page of runs is searched.
          run_id="$(node <<'NODE'
          'use strict';
          const env = process.env;
          function fail(message) {
            console.error('usabl: ' + message + '; failing closed');
            process.exit(1);
          }
          const want = {
            repository: env.GITHUB_REPOSITORY || '',
            workflowFile: env.WORKFLOW_FILE || '',
            workflowName: env.WORKFLOW_NAME || '',
            pr: env.PR_NUMBER || '',
            headRepository: env.HEAD_REPO || '',
            headSha: env.HEAD_SHA || '',
            baseSha: env.BASE_SHA || '',
          };
          const repoPattern = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;
          const shaPattern = /^[0-9a-f]{40}([0-9a-f]{24})?$/;
          if (!repoPattern.test(want.repository) || !repoPattern.test(want.headRepository)) fail('the repository names are not owner/name');
          if (!/^[A-Za-z0-9_.-]+\.ya?ml$/.test(want.workflowFile) || !/^[A-Za-z0-9_-]+$/.test(want.workflowName)) fail('the workflow is not named');
          if (!/^[1-9][0-9]*$/.test(want.pr)) fail('the pull request number is not a number');
          if (!shaPattern.test(want.headSha) || !shaPattern.test(want.baseSha)) fail('the head and base must be full commit SHAs');
          let api;
          try {
            api = new URL(env.GITHUB_API_URL || 'https://api.github.com');
          } catch {
            fail('GITHUB_API_URL is not a URL');
          }
          const loopback = ['localhost', '127.0.0.1', '[::1]'].includes(api.hostname);
          if (api.protocol !== 'https:' && !(api.protocol === 'http:' && loopback)) fail('GITHUB_API_URL must be https');
          if ((env.GH_TOKEN || '') === '') fail('GH_TOKEN is empty');
          const base = api.href.replace(/\/$/, '');
          const workflowPath = '.github/workflows/' + want.workflowFile;
          // The name the gate gave the pull_request run of this exact pull request, head, and base.
          const title = want.workflowName + ' pull_request pr ' + want.pr + ' head ' + want.headRepository + '@' + want.headSha + ' base ' + want.baseSha;

          async function get(path) {
            const response = await fetch(base + path, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: 'Bearer ' + env.GH_TOKEN,
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'usabl',
              },
              redirect: 'error',
            });
            if (!response.ok) fail('GitHub answered ' + response.status + ' for ' + path.split('?')[0]);
            return response.json();
          }

          function sameRun(run) {
            if (run === null || typeof run !== 'object' || !Number.isSafeInteger(run.id)) return false;
            const prs = Array.isArray(run.pull_requests) ? run.pull_requests : [];
            return (
              run.event === 'pull_request' &&
              run.head_sha === want.headSha &&
              run.display_title === title &&
              (run.path === workflowPath || String(run.path).startsWith(workflowPath + '@')) &&
              run.repository !== null && typeof run.repository === 'object' && run.repository.full_name === want.repository &&
              run.head_repository !== null && typeof run.head_repository === 'object' && run.head_repository.full_name === want.headRepository &&
              // GitHub lists the pull requests only for a head in this repository. When it does, this one must be among them.
              (prs.length === 0 || prs.some((pr) => pr !== null && typeof pr === 'object' && String(pr.number) === want.pr))
            );
          }

          async function pages(path, key, limit) {
            const all = [];
            for (let page = 1; ; page += 1) {
              if (page > limit) fail('there are more than ' + (limit * 100) + ' ' + key + ' to search');
              const body = await get(path + (path.includes('?') ? '&' : '?') + 'per_page=100&page=' + page);
              const items = body !== null && typeof body === 'object' && Array.isArray(body[key]) ? body[key] : null;
              if (items === null) fail('GitHub answered without a ' + key + ' list');
              all.push(...items);
              if (items.length < 100) return all;
            }
          }

          async function main() {
            const runs = await pages(
              '/repos/' + want.repository + '/actions/workflows/' + encodeURIComponent(want.workflowFile) +
                '/runs?event=pull_request&status=completed&head_sha=' + want.headSha,
              'workflow_runs',
              50,
            );
            const candidates = runs.filter(sameRun).sort((a, b) => b.id - a.id);
            for (const run of candidates) {
              const jobs = await pages('/repos/' + want.repository + '/actions/runs/' + run.id + '/jobs?filter=all', 'jobs', 10);
              // The latest attempt of build-app decides: a build that failed on a re-run is not this run's build.
              const builds = jobs
                .filter((job) => job !== null && typeof job === 'object' && job.name === 'build-app')
                .sort((a, b) => (b.run_attempt || 0) - (a.run_attempt || 0) || b.id - a.id);
              const latest = builds[0];
              if (latest !== undefined && latest.status === 'completed' && latest.conclusion === 'success') {
                process.stdout.write(String(run.id) + '\n');
                return;
              }
            }
            fail('no completed pull_request run built pull request ' + want.pr + ' at head ' + want.headSha + ' on base ' + want.baseSha);
          }

          main().catch((error) => fail('the lookup failed: ' + (error instanceof Error ? error.message : String(error))));
          NODE
          )"
          if ! [[ "${run_id}" =~ ^[0-9]+$ ]]; then
            echo "no completed pull_request run built this pull request at head ${HEAD_SHA} on base ${BASE_SHA}; failing closed"
            exit 1
          fi
          echo "BUILD_RUN_ID=${run_id}" >> "$GITHUB_ENV"

      - name: Fetch the build
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: usabl-app-build
          ARTIFACT_MEMBERS: usabl-app-build.tar
          ARTIFACT_RUN_ID: ${{ env.BUILD_RUN_ID }}
          ARTIFACT_MAX_BYTES: "2147483648"
          ARTIFACT_INTO: ${{ runner.temp }}/usabl-download-build
        run: |
          node "${RUNNER_TEMP}/usabl-fetch-artifact.cjs"

      - name: Verify and unpack the build
        working-directory: ${{ runner.temp }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_DIGEST: ${{ needs.build-app.outputs.build_digest }}
          DOWNLOAD_DIR: ${{ runner.temp }}/usabl-download-build
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            if ! [[ "${BUILD_DIGEST}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "the expected build digest is not a sha256 hex string; failing closed"
              exit 1
            fi
            if [ "$(ls -A "${DOWNLOAD_DIR}")" != "usabl-app-build.tar" ] || [ -L "${DOWNLOAD_DIR}/usabl-app-build.tar" ] || [ ! -f "${DOWNLOAD_DIR}/usabl-app-build.tar" ]; then
              echo "the build artifact is not exactly one regular file named usabl-app-build.tar; failing closed"
              exit 1
            fi
            printf '%s  %s\n' "${BUILD_DIGEST}" "${DOWNLOAD_DIR}/usabl-app-build.tar" | sha256sum -c -
          elif [ "$(ls -A "${DOWNLOAD_DIR}")" != "usabl-app-build.tar" ] || [ -L "${DOWNLOAD_DIR}/usabl-app-build.tar" ] || [ ! -f "${DOWNLOAD_DIR}/usabl-app-build.tar" ]; then
            echo "the build artifact is not exactly one regular file named usabl-app-build.tar; failing closed"
            exit 1
          fi
          # On a review the pull_request run's job outputs are out of reach, so there is nothing
          # to check against. A replaced build gains the author nothing they do not already have,
          # because they wrote the build. The judge records the digest it actually scanned.
          echo "USABL_BUILD_DIGEST=$(sha256sum "${DOWNLOAD_DIR}/usabl-app-build.tar" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          # Regular files and directories only, no absolute path, no .. segment, fresh directory.
          if ! [[ "${ENGINE_TREE_DIGEST}" =~ ^[0-9a-f]{64}$ ]] || [ "$(cd "${RUNNER_TEMP}/usabl-engine" && { find . -mindepth 1 -printf '%y %p %l\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum; } | sha256sum | cut -d' ' -f1)" != "${ENGINE_TREE_DIGEST}" ]; then
            echo "the trusted engine tree is not the one the engine job packed; failing closed"
            exit 1
          fi
          node "${RUNNER_TEMP}/usabl-engine/dist/cli.js" extract-build --archive "${DOWNLOAD_DIR}/usabl-app-build.tar" --into "${RUNNER_TEMP}/usabl-app"

      - name: Fetch the trusted base commit when absent
        working-directory: head
        run: |
          if ! [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            echo "the event base SHA is not a full commit SHA; failing closed"
            exit 1
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2> /dev/null; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          fi

      - name: Allow the Chromium sandbox
        run: |
          # Ubuntu runners restrict unprivileged user namespaces through AppArmor, and the Chromium
          # sandbox needs them. No head code runs in this job, so this only lets the sandbox start.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Serve the build on the trusted app origin
        working-directory: head
        run: |
          # The engine reads appBaseUrl from the trusted base commit, never from the head, and binds
          # only a loopback host with an explicit port. A pull request cannot move the judge to a
          # server of its own.
          if ! [[ "${ENGINE_TREE_DIGEST}" =~ ^[0-9a-f]{64}$ ]] || [ "$(cd "${RUNNER_TEMP}/usabl-engine" && { find . -mindepth 1 -printf '%y %p %l\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum; } | sha256sum | cut -d' ' -f1)" != "${ENGINE_TREE_DIGEST}" ]; then
            echo "the trusted engine tree is not the one the engine job packed; failing closed"
            exit 1
          fi
          node "${RUNNER_TEMP}/usabl-engine/dist/cli.js" serve-build --dir "${RUNNER_TEMP}/usabl-app" --trusted-ref "${BASE_SHA}" > "${RUNNER_TEMP}/usabl-serve.log" 2>&1 &
          echo "SERVE_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if grep -q 'usabl: serving' "${RUNNER_TEMP}/usabl-serve.log"; then
              exit 0
            fi
            sleep 1
          done
          echo "the build server did not start"
          cat "${RUNNER_TEMP}/usabl-serve.log"
          exit 1

      - name: Run the judge
        id: usabl
        working-directory: head
        run: |
          mkdir "${RUNNER_TEMP}/usabl-judge"
          code=0
          # Keep || code=$? on the same line, because a next-line $? becomes 0 under set -e.
          # trusted-ref is the event's base commit, so a PR cannot rewrite policy and pass itself.
          # The engine reads this head tree as data; it is never imported or executed.
          if ! [[ "${ENGINE_TREE_DIGEST}" =~ ^[0-9a-f]{64}$ ]] || [ "$(cd "${RUNNER_TEMP}/usabl-engine" && { find . -mindepth 1 -printf '%y %p %l\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum; } | sha256sum | cut -d' ' -f1)" != "${ENGINE_TREE_DIGEST}" ]; then
            echo "the trusted engine tree is not the one the engine job packed; failing closed"
            exit 1
          fi
          node "${RUNNER_TEMP}/usabl-engine/dist/cli.js" check --ci --trusted-ref "${BASE_SHA}" --isolated-browser --json > "${RUNNER_TEMP}/usabl-judge/usabl-result.json" || code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"

      - name: Stop the build server
        if: always()
        run: |
          if [ -n "${SERVE_PID:-}" ]; then
            kill "${SERVE_PID}" || true
          fi

      - name: Validate the Result and resolve the verdict
        id: verdict
        if: always()
        # The runner temp directory, which exists even when an earlier step failed, so the verdict
        # is always published.
        working-directory: ${{ runner.temp }}
        env:
          USABL_EXIT: ${{ steps.usabl.outputs.exit_code }}
        run: |
          # The verdict starts at fail and only a valid Result and a clean enforce move it. A
          # Result that fails validation gets no digest, so no other job will read it.
          verdict=fail
          digest=
          # The engine check runs in a subshell, so a mismatch leaves the verdict at fail and still
          # publishes it.
          if (
          if ! [[ "${ENGINE_TREE_DIGEST}" =~ ^[0-9a-f]{64}$ ]] || [ "$(cd "${RUNNER_TEMP}/usabl-engine" && { find . -mindepth 1 -printf '%y %p %l\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum; } | sha256sum | cut -d' ' -f1)" != "${ENGINE_TREE_DIGEST}" ]; then
            echo "the trusted engine tree is not the one the engine job packed; failing closed"
            exit 1
          fi
          ) && [ -s usabl-judge/usabl-result.json ] && [ -n "${USABL_EXIT}" ] && (
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('usabl-judge/usabl-result.json', 'utf8'));
          const capturedExit = Number(process.env.USABL_EXIT);
          if (result.schemaVersion !== 'usabl.result.v1') {
            throw new Error('usabl produced an unsupported Result schema');
          }
          if (!Number.isInteger(result.exitCode)) {
            throw new Error('usabl Result has no integer exit code');
          }
          if (!Number.isInteger(capturedExit) || result.exitCode !== capturedExit) {
            throw new Error('usabl Result exit code does not match the process exit code');
          }
          if (result.accessibilityExitCode === 2) {
            throw new Error('accessibilityExitCode cannot be 2');
          }
          if (result.judge === undefined || result.judge.isolatedBrowser !== true) {
            throw new Error('usabl Result does not record the isolated browser');
          }
          if (result.judge.buildDigest !== process.env.USABL_BUILD_DIGEST) {
            throw new Error('usabl Result does not record the build digest this job verified');
          }
          NODE
          ); then
            digest="$(sha256sum usabl-judge/usabl-result.json | cut -d' ' -f1)"
            code=0
            # Keep || code=$? on the same line, because a next-line $? becomes 0 under set -e.
            node "${RUNNER_TEMP}/usabl-engine/dist/cli.js" enforce accessibility < usabl-judge/usabl-result.json || code=$?
            if [ "${code}" = "0" ]; then
              verdict=pass
            fi
          else
            echo "the judge produced no valid Result; reporting the accessibility verdict as fail"
          fi
          echo "accessibility verdict: ${verdict}"
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          echo "result_digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Upload Result JSON
        # Uploaded before enforcement, so the comment can explain a failed scan.
        if: always() && steps.verdict.outputs.result_digest != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usabl-result
          path: ${{ runner.temp }}/usabl-judge/usabl-result.json
          if-no-files-found: error
          retention-days: 1

      - name: Enforce accessibility
        if: always()
        env:
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          # Never exit 2 here. Guarded-file approval lives on usabl-policy.
          if [ "${VERDICT}" != "pass" ]; then
            echo "accessibility verdict is ${VERDICT:-missing}; see the usabl comment for the barriers"
            exit 1
          fi

  gate-comment:
    # Presentation only: it posts the sticky comment and decides nothing. It runs no head code and
    # no browser, and it believes the Result only after checking it against result_digest, the
    # judge's own job output. It runs after a failed scan too, whenever the judge produced a valid
    # Result, so a regression is explained on the pull request.
    needs: [usabl-engine, usabl-scan]
    if: >-
      always() && github.event_name == 'pull_request' &&
      needs.usabl-engine.result == 'success' && needs.usabl-scan.outputs.result_digest != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only the artifact fetch uses this: it lists this run's artifacts and downloads the Result.
      actions: read
      pull-requests: write
    env:
      ENGINE_TREE_DIGEST: ${{ needs.usabl-engine.outputs.engine_tree_digest }}
    steps:
      - name: Checkout trusted base config
        # The base commit only, and only the config, for the comment noise budget.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          sparse-checkout: usabl.config.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          # setup-node turns npm caching on by itself when package.json names npm. A cache can be
          # written by pull request code, so every job turns it off by name.
          package-manager-cache: false

      - name: Write the artifact fetcher
        working-directory: ${{ runner.temp }}
        run: |
          # usabl's own artifact fetcher, Node builtins only. No trusted job extracts an artifact
          # with actions/download-artifact, whose zip extraction follows .. inside entry names.
          set -o noclobber
          cat > "${RUNNER_TEMP}/usabl-fetch-artifact.cjs" <<'NODE'
          'use strict';
          // usabl artifact fetcher. Node builtins only. It refuses an artifact rather than repair it.
          const fs = require('node:fs');
          const fsp = require('node:fs/promises');
          const path = require('node:path');
          const zlib = require('node:zlib');
          const { Readable, Transform } = require('node:stream');
          const { pipeline } = require('node:stream/promises');

          class Refusal extends Error {}
          function refuse(message) {
            throw new Refusal(message);
          }

          const CRC_TABLE = new Int32Array(256).map((_, n) => {
            let c = n;
            for (let k = 0; k < 8; k += 1) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
            return c;
          });
          function crc32(chunk, previous) {
            if (typeof zlib.crc32 === 'function') return zlib.crc32(chunk, previous);
            let c = previous ^ -1;
            for (let i = 0; i < chunk.length; i += 1) c = CRC_TABLE[(c ^ chunk[i]) & 0xff] ^ (c >>> 8);
            return (c ^ -1) >>> 0;
          }

          function isLoopback(hostname) {
            return hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '[::1]';
          }

          function settings(env) {
            const name = env.ARTIFACT_NAME || '';
            if (!/^[a-z0-9][a-z0-9-]*$/.test(name)) refuse('ARTIFACT_NAME is not a plain artifact name');
            const members = (env.ARTIFACT_MEMBERS || '').split(',');
            for (const member of members) {
              if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(member) || member.includes('..')) {
                refuse('ARTIFACT_MEMBERS must list plain file names');
              }
            }
            if (new Set(members).size !== members.length) refuse('ARTIFACT_MEMBERS lists a name twice');
            const runId = env.ARTIFACT_RUN_ID || '';
            if (!/^[0-9]+$/.test(runId)) refuse('ARTIFACT_RUN_ID is not a run id');
            const maxBytes = Number(env.ARTIFACT_MAX_BYTES);
            if (!Number.isSafeInteger(maxBytes) || maxBytes <= 0) refuse('ARTIFACT_MAX_BYTES is not a byte count');
            const into = env.ARTIFACT_INTO || '';
            if (!path.isAbsolute(into) || path.resolve(into) !== into) refuse('ARTIFACT_INTO is not a plain absolute path');
            const workspace = env.GITHUB_WORKSPACE || '';
            if (workspace !== '') {
              const relative = path.relative(path.resolve(workspace), into);
              if (relative === '' || (!relative.startsWith('..') && !path.isAbsolute(relative))) {
                refuse('ARTIFACT_INTO must be outside the workspace');
              }
            }
            let api;
            try {
              api = new URL(env.GITHUB_API_URL || 'https://api.github.com');
            } catch {
              refuse('GITHUB_API_URL is not a URL');
            }
            if (api.protocol !== 'https:' && !(api.protocol === 'http:' && isLoopback(api.hostname))) {
              refuse('GITHUB_API_URL must be https');
            }
            const repository = env.GITHUB_REPOSITORY || '';
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) refuse('GITHUB_REPOSITORY is not owner/name');
            const token = env.GH_TOKEN || '';
            if (token === '') refuse('GH_TOKEN is empty');
            return { name, members, runId, maxBytes, into, api, repository, token };
          }

          function apiUrl(s, pathname) {
            return new URL(s.api.href.replace(/\/$/, '') + pathname);
          }

          function apiHeaders(s) {
            return {
              Accept: 'application/vnd.github+json',
              Authorization: 'Bearer ' + s.token,
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'usabl',
            };
          }

          async function findArtifact(s) {
            const url = apiUrl(s, '/repos/' + s.repository + '/actions/runs/' + s.runId + '/artifacts?per_page=100&name=' + encodeURIComponent(s.name));
            const response = await fetch(url, { headers: apiHeaders(s), redirect: 'error' });
            if (!response.ok) refuse('GitHub answered ' + response.status + ' when listing the artifacts of run ' + s.runId);
            const listing = await response.json();
            const artifacts = listing !== null && typeof listing === 'object' && Array.isArray(listing.artifacts) ? listing.artifacts : [];
            // An artifact replaced in the run keeps its name and gets a new id, so the newest one is the one
            // the run holds now. Its content is checked against a job output after this.
            const found = artifacts
              .filter((a) => a !== null && typeof a === 'object' && a.name === s.name && a.expired !== true && Number.isSafeInteger(a.id))
              .sort((a, b) => b.id - a.id);
            if (found.length === 0) refuse('run ' + s.runId + ' has no artifact named ' + s.name);
            const artifact = found[0];
            if (typeof artifact.size_in_bytes === 'number' && artifact.size_in_bytes > s.maxBytes) {
              refuse('the artifact is ' + artifact.size_in_bytes + ' bytes, over the limit of ' + s.maxBytes);
            }
            return artifact.id;
          }

          async function download(s, id, zipPath) {
            const first = await fetch(apiUrl(s, '/repos/' + s.repository + '/actions/artifacts/' + id + '/zip'), {
              headers: apiHeaders(s),
              redirect: 'manual',
            });
            let response = first;
            if (first.status >= 300 && first.status < 400) {
              const location = first.headers.get('location');
              if (location === null) refuse('GitHub redirected the artifact download nowhere');
              const target = new URL(location, s.api);
              if (target.protocol !== 'https:' && !(target.protocol === 'http:' && s.api.protocol === 'http:' && isLoopback(target.hostname))) {
                refuse('the artifact download was redirected to a URL that is not https');
              }
              if (first.body !== null) await first.body.cancel();
              // The storage URL is signed. The job token is never sent to it.
              response = await fetch(target, { redirect: 'error' });
            }
            if (!response.ok || response.body === null) refuse('the artifact download answered ' + response.status);
            const declared = Number(response.headers.get('content-length'));
            if (Number.isFinite(declared) && declared > s.maxBytes) refuse('the artifact zip is over the limit of ' + s.maxBytes + ' bytes');
            const out = await fsp.open(zipPath, 'wx', 0o600);
            let total = 0;
            try {
              for await (const chunk of Readable.fromWeb(response.body)) {
                total += chunk.length;
                if (total > s.maxBytes) refuse('the artifact zip is over the limit of ' + s.maxBytes + ' bytes');
                await out.write(chunk);
              }
            } finally {
              await out.close();
            }
          }

          async function readAt(handle, offset, length) {
            const buffer = Buffer.alloc(length);
            const { bytesRead } = await handle.read(buffer, 0, length, offset);
            if (bytesRead !== length) refuse('the artifact zip ends early');
            return buffer;
          }

          // Why an entry name is refused, or null when it is exactly one of the expected members.
          function nameRefusal(raw, members, seen) {
            let name;
            try {
              name = new TextDecoder('utf-8', { fatal: true }).decode(raw);
            } catch {
              return 'an entry name is not UTF-8';
            }
            const shown = JSON.stringify(name);
            if (name === '' || name.includes('\0')) return 'an entry has an empty or NUL name';
            if (name.startsWith('/') || name.startsWith('\\') || /^[A-Za-z]:/.test(name)) return 'entry ' + shown + ' is an absolute path';
            if (name.split(/[\\/]/).includes('..')) return 'entry ' + shown + ' has a .. segment';
            if (name.includes('/') || name.includes('\\')) return 'entry ' + shown + ' is a path, not one of the expected file names';
            if (!members.includes(name)) return 'entry ' + shown + ' is not an expected member (' + members.join(', ') + ')';
            if (seen.has(name)) return 'entry ' + shown + ' appears twice';
            return null;
          }

          async function readEntries(handle, s) {
            const size = (await handle.stat()).size;
            if (size < 22) refuse('the artifact is not a zip archive');
            const tailLength = Math.min(size, 22 + 0xffff);
            const tailStart = size - tailLength;
            const tail = await readAt(handle, tailStart, tailLength);
            let eocd = -1;
            for (let i = tail.length - 22; i >= 0; i -= 1) {
              if (tail.readUInt32LE(i) === 0x06054b50 && i + 22 + tail.readUInt16LE(i + 20) === tail.length) {
                eocd = i;
                break;
              }
            }
            if (eocd === -1) refuse('the artifact is not a zip archive');
            const eocdOffset = tailStart + eocd;
            const disk = tail.readUInt16LE(eocd + 4);
            const cdDisk = tail.readUInt16LE(eocd + 6);
            const onDisk = tail.readUInt16LE(eocd + 8);
            const total = tail.readUInt16LE(eocd + 10);
            const cdSize = tail.readUInt32LE(eocd + 12);
            const cdOffset = tail.readUInt32LE(eocd + 16);
            if (total === 0xffff || cdSize === 0xffffffff || cdOffset === 0xffffffff) refuse('zip64 archives are not accepted');
            if (eocdOffset >= 20 && (await readAt(handle, eocdOffset - 20, 4)).readUInt32LE(0) === 0x07064b50) {
              refuse('zip64 archives are not accepted');
            }
            if (disk !== 0 || cdDisk !== 0 || onDisk !== total) refuse('split zip archives are not accepted');
            if (total !== s.members.length) {
              refuse('the artifact has ' + total + ' entries, and it must hold exactly ' + s.members.join(', '));
            }
            if (cdOffset + cdSize !== eocdOffset || cdSize > 1024 * total) refuse('the zip central directory is malformed');
            const cd = await readAt(handle, cdOffset, cdSize);
            const entries = [];
            const seen = new Set();
            let p = 0;
            for (let i = 0; i < total; i += 1) {
              if (p + 46 > cd.length || cd.readUInt32LE(p) !== 0x02014b50) refuse('the zip central directory is malformed');
              const entry = {
                madeBy: cd.readUInt16LE(p + 4),
                flags: cd.readUInt16LE(p + 8),
                method: cd.readUInt16LE(p + 10),
                crc: cd.readUInt32LE(p + 16),
                compressedSize: cd.readUInt32LE(p + 20),
                size: cd.readUInt32LE(p + 24),
                diskStart: cd.readUInt16LE(p + 34),
                external: cd.readUInt32LE(p + 38),
                offset: cd.readUInt32LE(p + 42),
              };
              const nameLength = cd.readUInt16LE(p + 28);
              const end = p + 46 + nameLength + cd.readUInt16LE(p + 30) + cd.readUInt16LE(p + 32);
              if (end > cd.length) refuse('the zip central directory is malformed');
              entry.rawName = cd.subarray(p + 46, p + 46 + nameLength);
              const why = nameRefusal(entry.rawName, s.members, seen);
              if (why !== null) refuse(why);
              entry.name = entry.rawName.toString('utf8');
              seen.add(entry.name);
              if ((entry.flags & 0x2041) !== 0) refuse('entry ' + entry.name + ' is encrypted');
              if (entry.method !== 0 && entry.method !== 8) refuse('entry ' + entry.name + ' uses an unsupported compression method');
              if (entry.compressedSize === 0xffffffff || entry.size === 0xffffffff || entry.offset === 0xffffffff || entry.diskStart !== 0) {
                refuse('zip64 archives are not accepted');
              }
              const host = entry.madeBy >>> 8;
              const unixType = (entry.external >>> 16) & 0o170000;
              if (host === 3 && unixType !== 0 && unixType !== 0o100000) refuse('entry ' + entry.name + ' is not a regular file');
              if (host !== 3 && host !== 0) refuse('entry ' + entry.name + ' was made on a system whose file types are not checked');
              if ((entry.external & 0x10) !== 0) refuse('entry ' + entry.name + ' is a directory');
              if (entry.size > s.maxBytes) refuse('entry ' + entry.name + ' unpacks to ' + entry.size + ' bytes, over the limit of ' + s.maxBytes);
              if (entry.method === 0 && entry.compressedSize !== entry.size) refuse('entry ' + entry.name + ' has inconsistent sizes');
              if (entry.method === 8 && entry.compressedSize === 0) refuse('entry ' + entry.name + ' has inconsistent sizes');
              entries.push(entry);
              p = end;
            }
            if (p !== cd.length) refuse('the zip central directory is malformed');
            for (const entry of entries) {
              if (entry.offset + 30 > cdOffset) refuse('entry ' + entry.name + ' points outside the archive');
              const local = await readAt(handle, entry.offset, 30);
              const nameLength = local.readUInt16LE(26);
              const dataStart = entry.offset + 30 + nameLength + local.readUInt16LE(28);
              if (
                local.readUInt32LE(0) !== 0x04034b50 ||
                local.readUInt16LE(6) !== entry.flags ||
                local.readUInt16LE(8) !== entry.method ||
                dataStart + entry.compressedSize > cdOffset ||
                !(await readAt(handle, entry.offset + 30, nameLength)).equals(entry.rawName)
              ) {
                refuse('the local header of entry ' + entry.name + ' does not match the central directory');
              }
              if ((entry.flags & 0x8) === 0) {
                if (local.readUInt32LE(14) !== entry.crc || local.readUInt32LE(18) !== entry.compressedSize || local.readUInt32LE(22) !== entry.size) {
                  refuse('the local header of entry ' + entry.name + ' does not match the central directory');
                }
              }
              entry.dataStart = dataStart;
            }
            return entries;
          }

          async function extract(handle, entry, into) {
            const target = path.join(into, entry.name);
            const flags = fs.constants.O_WRONLY | fs.constants.O_CREAT | fs.constants.O_EXCL | fs.constants.O_NOFOLLOW;
            const out = await fsp.open(target, flags, 0o600);
            let written = 0;
            let crc = 0;
            const count = new Transform({
              transform(chunk, _encoding, done) {
                written += chunk.length;
                if (written > entry.size) {
                  done(new Refusal('entry ' + entry.name + ' unpacks to more than the ' + entry.size + ' bytes it declares'));
                  return;
                }
                crc = crc32(chunk, crc);
                done(null, chunk);
              },
            });
            if (entry.compressedSize === 0) {
              await out.close();
            } else {
              const source = handle.createReadStream({ start: entry.dataStart, end: entry.dataStart + entry.compressedSize - 1, autoClose: false });
              const stages = entry.method === 8 ? [source, zlib.createInflateRaw(), count] : [source, count];
              await pipeline(...stages, out.createWriteStream());
            }
            if (written !== entry.size || crc !== entry.crc) refuse('entry ' + entry.name + ' does not match its declared size and checksum');
          }

          async function main() {
            const s = settings(process.env);
            const zipPath = s.into + '.zip';
            let created = false;
            try {
              const id = await findArtifact(s);
              await download(s, id, zipPath);
              const handle = await fsp.open(zipPath, 'r');
              try {
                const entries = await readEntries(handle, s);
                // A fresh directory: mkdir refuses one that already exists.
                await fsp.mkdir(s.into, { mode: 0o700 });
                created = true;
                for (const entry of entries) await extract(handle, entry, s.into);
              } finally {
                await handle.close();
              }
              console.log('usabl: fetched ' + s.members.join(', ') + ' from artifact ' + s.name + ' into ' + s.into);
            } catch (error) {
              if (created) await fsp.rm(s.into, { recursive: true, force: true });
              throw error;
            } finally {
              await fsp.rm(zipPath, { force: true });
            }
          }

          main().catch((error) => {
            const what = error instanceof Refusal ? error.message : 'the fetch failed: ' + (error instanceof Error ? error.message : String(error));
            console.error('usabl: refusing the ' + (process.env.ARTIFACT_NAME || '') + ' artifact: ' + what + '; failing closed');
            process.exit(1);
          });
          NODE

      - name: Fetch, verify, and unpack the trusted engine
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: usabl-engine
          ARTIFACT_MEMBERS: usabl-engine.tgz
          ARTIFACT_RUN_ID: ${{ github.run_id }}
          ARTIFACT_MAX_BYTES: "536870912"
          ARTIFACT_INTO: ${{ runner.temp }}/usabl-download-engine
          ENGINE_DIGEST: ${{ needs.usabl-engine.outputs.engine_digest }}
          DOWNLOAD_DIR: ${{ runner.temp }}/usabl-download-engine
        run: |
          node "${RUNNER_TEMP}/usabl-fetch-artifact.cjs"
          if ! [[ "${ENGINE_DIGEST}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "the expected engine digest is not a sha256 hex string; failing closed"
            exit 1
          fi
          if [ "$(ls -A "${DOWNLOAD_DIR}")" != "usabl-engine.tgz" ] || [ -L "${DOWNLOAD_DIR}/usabl-engine.tgz" ] || [ ! -f "${DOWNLOAD_DIR}/usabl-engine.tgz" ]; then
            echo "the engine artifact is not exactly one regular file named usabl-engine.tgz; failing closed"
            exit 1
          fi
          printf '%s  %s\n' "${ENGINE_DIGEST}" "${DOWNLOAD_DIR}/usabl-engine.tgz" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/usabl-engine"
          tar --extract --gzip --no-same-owner --file "${DOWNLOAD_DIR}/usabl-engine.tgz" --directory "${RUNNER_TEMP}/usabl-engine"

      - name: Fetch Result JSON
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: usabl-result
          ARTIFACT_MEMBERS: usabl-result.json
          ARTIFACT_RUN_ID: ${{ github.run_id }}
          ARTIFACT_MAX_BYTES: "67108864"
          ARTIFACT_INTO: ${{ runner.temp }}/usabl-download-result
        run: |
          node "${RUNNER_TEMP}/usabl-fetch-artifact.cjs"

      - name: Verify Result JSON and render the comment
        working-directory: ${{ runner.temp }}
        env:
          RESULT_DIGEST: ${{ needs.usabl-scan.outputs.result_digest }}
          DOWNLOAD_DIR: ${{ runner.temp }}/usabl-download-result
        run: |
          if ! [[ "${RESULT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "the expected Result digest is not a sha256 hex string; failing closed"
            exit 1
          fi
          if [ "$(ls -A "${DOWNLOAD_DIR}")" != "usabl-result.json" ] || [ -L "${DOWNLOAD_DIR}/usabl-result.json" ] || [ ! -f "${DOWNLOAD_DIR}/usabl-result.json" ]; then
            echo "the Result artifact is not exactly one regular file named usabl-result.json; failing closed"
            exit 1
          fi
          printf '%s  %s\n' "${RESULT_DIGEST}" "${DOWNLOAD_DIR}/usabl-result.json" | sha256sum -c -
          if ! [[ "${ENGINE_TREE_DIGEST}" =~ ^[0-9a-f]{64}$ ]] || [ "$(cd "${RUNNER_TEMP}/usabl-engine" && { find . -mindepth 1 -printf '%y %p %l\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum; } | sha256sum | cut -d' ' -f1)" != "${ENGINE_TREE_DIGEST}" ]; then
            echo "the trusted engine tree is not the one the engine job packed; failing closed"
            exit 1
          fi
          code=0
          node "${RUNNER_TEMP}/usabl-engine/dist/cli.js" comment --config "${GITHUB_WORKSPACE}/base/usabl.config.json" < "${DOWNLOAD_DIR}/usabl-result.json" > usabl-comment.md || code=$?
          if [ ! -s usabl-comment.md ] || ! grep -q '<!-- usabl-report -->' usabl-comment.md; then
            echo "comment renderer produced no usabl markdown (exit ${code})"
            exit 1
          fi

      - name: Show the comment in the job summary for a fork
        # A pull request from a fork gets a token that cannot write to the pull request, so the
        # comment goes to this run's summary instead. The comment decides nothing either way.
        if: github.event.pull_request.head.repo.full_name != github.repository
        env:
          COMMENT_PATH: ${{ runner.temp }}/usabl-comment.md
        run: cat "${COMMENT_PATH}" >> "$GITHUB_STEP_SUMMARY"

      - name: Post sticky PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          COMMENT_PATH: ${{ runner.temp }}/usabl-comment.md
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- usabl-report -->';
            const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  usabl-policy:
    # The policy verdict. It re-runs on pull_request_review so a CODEOWNERS approval or dismissal
    # flips the gate. It must never check out or execute PR head code: it reads the head only as
    # git objects and decides from the trusted base ref, CODEOWNERS, and the reviews API. Its
    # engine is the verified usabl-engine archive, so there is no second engine checkout here.
    # Do not make this the required check on its own: it returns success
    # whenever no guarded path diverged, which says nothing about accessibility.
    needs: [usabl-engine, usabl-scan]
    if: always() && needs.usabl-engine.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only the artifact fetch uses this: it lists this run's artifacts and downloads the Result.
      actions: read
      pull-requests: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      ENGINE_TREE_DIGEST: ${{ needs.usabl-engine.outputs.engine_tree_digest }}
    steps:
      - name: Checkout trusted base-ref policy
        # Check out the base commit, never the PR head. This working tree is trusted.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch head objects without checkout
        run: |
          # PR_NUMBER comes from the event as an integer. Guard it anyway before it
          # reaches a ref path, so a malformed value can never inject a fetch refspec.
          case "${PR_NUMBER}" in
            ''|*[!0-9]*)
              echo "pull request number is not numeric; failing closed"
              exit 1
              ;;
          esac
          # The base commit is this checkout. Bring the PR head as objects only. enforce policy
          # reads blob contents with git show and git ls-tree, which never check out or execute
          # the head, so no PR code runs.
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          # setup-node turns npm caching on by itself when package.json names npm. A cache can be
          # written by pull request code, so every job turns it off by name.
          package-manager-cache: false

      - name: Write the artifact fetcher
        working-directory: ${{ runner.temp }}
        run: |
          # usabl's own artifact fetcher, Node builtins only. No trusted job extracts an artifact
          # with actions/download-artifact, whose zip extraction follows .. inside entry names.
          set -o noclobber
          cat > "${RUNNER_TEMP}/usabl-fetch-artifact.cjs" <<'NODE'
          'use strict';
          // usabl artifact fetcher. Node builtins only. It refuses an artifact rather than repair it.
          const fs = require('node:fs');
          const fsp = require('node:fs/promises');
          const path = require('node:path');
          const zlib = require('node:zlib');
          const { Readable, Transform } = require('node:stream');
          const { pipeline } = require('node:stream/promises');

          class Refusal extends Error {}
          function refuse(message) {
            throw new Refusal(message);
          }

          const CRC_TABLE = new Int32Array(256).map((_, n) => {
            let c = n;
            for (let k = 0; k < 8; k += 1) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
            return c;
          });
          function crc32(chunk, previous) {
            if (typeof zlib.crc32 === 'function') return zlib.crc32(chunk, previous);
            let c = previous ^ -1;
            for (let i = 0; i < chunk.length; i += 1) c = CRC_TABLE[(c ^ chunk[i]) & 0xff] ^ (c >>> 8);
            return (c ^ -1) >>> 0;
          }

          function isLoopback(hostname) {
            return hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '[::1]';
          }

          function settings(env) {
            const name = env.ARTIFACT_NAME || '';
            if (!/^[a-z0-9][a-z0-9-]*$/.test(name)) refuse('ARTIFACT_NAME is not a plain artifact name');
            const members = (env.ARTIFACT_MEMBERS || '').split(',');
            for (const member of members) {
              if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(member) || member.includes('..')) {
                refuse('ARTIFACT_MEMBERS must list plain file names');
              }
            }
            if (new Set(members).size !== members.length) refuse('ARTIFACT_MEMBERS lists a name twice');
            const runId = env.ARTIFACT_RUN_ID || '';
            if (!/^[0-9]+$/.test(runId)) refuse('ARTIFACT_RUN_ID is not a run id');
            const maxBytes = Number(env.ARTIFACT_MAX_BYTES);
            if (!Number.isSafeInteger(maxBytes) || maxBytes <= 0) refuse('ARTIFACT_MAX_BYTES is not a byte count');
            const into = env.ARTIFACT_INTO || '';
            if (!path.isAbsolute(into) || path.resolve(into) !== into) refuse('ARTIFACT_INTO is not a plain absolute path');
            const workspace = env.GITHUB_WORKSPACE || '';
            if (workspace !== '') {
              const relative = path.relative(path.resolve(workspace), into);
              if (relative === '' || (!relative.startsWith('..') && !path.isAbsolute(relative))) {
                refuse('ARTIFACT_INTO must be outside the workspace');
              }
            }
            let api;
            try {
              api = new URL(env.GITHUB_API_URL || 'https://api.github.com');
            } catch {
              refuse('GITHUB_API_URL is not a URL');
            }
            if (api.protocol !== 'https:' && !(api.protocol === 'http:' && isLoopback(api.hostname))) {
              refuse('GITHUB_API_URL must be https');
            }
            const repository = env.GITHUB_REPOSITORY || '';
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) refuse('GITHUB_REPOSITORY is not owner/name');
            const token = env.GH_TOKEN || '';
            if (token === '') refuse('GH_TOKEN is empty');
            return { name, members, runId, maxBytes, into, api, repository, token };
          }

          function apiUrl(s, pathname) {
            return new URL(s.api.href.replace(/\/$/, '') + pathname);
          }

          function apiHeaders(s) {
            return {
              Accept: 'application/vnd.github+json',
              Authorization: 'Bearer ' + s.token,
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'usabl',
            };
          }

          async function findArtifact(s) {
            const url = apiUrl(s, '/repos/' + s.repository + '/actions/runs/' + s.runId + '/artifacts?per_page=100&name=' + encodeURIComponent(s.name));
            const response = await fetch(url, { headers: apiHeaders(s), redirect: 'error' });
            if (!response.ok) refuse('GitHub answered ' + response.status + ' when listing the artifacts of run ' + s.runId);
            const listing = await response.json();
            const artifacts = listing !== null && typeof listing === 'object' && Array.isArray(listing.artifacts) ? listing.artifacts : [];
            // An artifact replaced in the run keeps its name and gets a new id, so the newest one is the one
            // the run holds now. Its content is checked against a job output after this.
            const found = artifacts
              .filter((a) => a !== null && typeof a === 'object' && a.name === s.name && a.expired !== true && Number.isSafeInteger(a.id))
              .sort((a, b) => b.id - a.id);
            if (found.length === 0) refuse('run ' + s.runId + ' has no artifact named ' + s.name);
            const artifact = found[0];
            if (typeof artifact.size_in_bytes === 'number' && artifact.size_in_bytes > s.maxBytes) {
              refuse('the artifact is ' + artifact.size_in_bytes + ' bytes, over the limit of ' + s.maxBytes);
            }
            return artifact.id;
          }

          async function download(s, id, zipPath) {
            const first = await fetch(apiUrl(s, '/repos/' + s.repository + '/actions/artifacts/' + id + '/zip'), {
              headers: apiHeaders(s),
              redirect: 'manual',
            });
            let response = first;
            if (first.status >= 300 && first.status < 400) {
              const location = first.headers.get('location');
              if (location === null) refuse('GitHub redirected the artifact download nowhere');
              const target = new URL(location, s.api);
              if (target.protocol !== 'https:' && !(target.protocol === 'http:' && s.api.protocol === 'http:' && isLoopback(target.hostname))) {
                refuse('the artifact download was redirected to a URL that is not https');
              }
              if (first.body !== null) await first.body.cancel();
              // The storage URL is signed. The job token is never sent to it.
              response = await fetch(target, { redirect: 'error' });
            }
            if (!response.ok || response.body === null) refuse('the artifact download answered ' + response.status);
            const declared = Number(response.headers.get('content-length'));
            if (Number.isFinite(declared) && declared > s.maxBytes) refuse('the artifact zip is over the limit of ' + s.maxBytes + ' bytes');
            const out = await fsp.open(zipPath, 'wx', 0o600);
            let total = 0;
            try {
              for await (const chunk of Readable.fromWeb(response.body)) {
                total += chunk.length;
                if (total > s.maxBytes) refuse('the artifact zip is over the limit of ' + s.maxBytes + ' bytes');
                await out.write(chunk);
              }
            } finally {
              await out.close();
            }
          }

          async function readAt(handle, offset, length) {
            const buffer = Buffer.alloc(length);
            const { bytesRead } = await handle.read(buffer, 0, length, offset);
            if (bytesRead !== length) refuse('the artifact zip ends early');
            return buffer;
          }

          // Why an entry name is refused, or null when it is exactly one of the expected members.
          function nameRefusal(raw, members, seen) {
            let name;
            try {
              name = new TextDecoder('utf-8', { fatal: true }).decode(raw);
            } catch {
              return 'an entry name is not UTF-8';
            }
            const shown = JSON.stringify(name);
            if (name === '' || name.includes('\0')) return 'an entry has an empty or NUL name';
            if (name.startsWith('/') || name.startsWith('\\') || /^[A-Za-z]:/.test(name)) return 'entry ' + shown + ' is an absolute path';
            if (name.split(/[\\/]/).includes('..')) return 'entry ' + shown + ' has a .. segment';
            if (name.includes('/') || name.includes('\\')) return 'entry ' + shown + ' is a path, not one of the expected file names';
            if (!members.includes(name)) return 'entry ' + shown + ' is not an expected member (' + members.join(', ') + ')';
            if (seen.has(name)) return 'entry ' + shown + ' appears twice';
            return null;
          }

          async function readEntries(handle, s) {
            const size = (await handle.stat()).size;
            if (size < 22) refuse('the artifact is not a zip archive');
            const tailLength = Math.min(size, 22 + 0xffff);
            const tailStart = size - tailLength;
            const tail = await readAt(handle, tailStart, tailLength);
            let eocd = -1;
            for (let i = tail.length - 22; i >= 0; i -= 1) {
              if (tail.readUInt32LE(i) === 0x06054b50 && i + 22 + tail.readUInt16LE(i + 20) === tail.length) {
                eocd = i;
                break;
              }
            }
            if (eocd === -1) refuse('the artifact is not a zip archive');
            const eocdOffset = tailStart + eocd;
            const disk = tail.readUInt16LE(eocd + 4);
            const cdDisk = tail.readUInt16LE(eocd + 6);
            const onDisk = tail.readUInt16LE(eocd + 8);
            const total = tail.readUInt16LE(eocd + 10);
            const cdSize = tail.readUInt32LE(eocd + 12);
            const cdOffset = tail.readUInt32LE(eocd + 16);
            if (total === 0xffff || cdSize === 0xffffffff || cdOffset === 0xffffffff) refuse('zip64 archives are not accepted');
            if (eocdOffset >= 20 && (await readAt(handle, eocdOffset - 20, 4)).readUInt32LE(0) === 0x07064b50) {
              refuse('zip64 archives are not accepted');
            }
            if (disk !== 0 || cdDisk !== 0 || onDisk !== total) refuse('split zip archives are not accepted');
            if (total !== s.members.length) {
              refuse('the artifact has ' + total + ' entries, and it must hold exactly ' + s.members.join(', '));
            }
            if (cdOffset + cdSize !== eocdOffset || cdSize > 1024 * total) refuse('the zip central directory is malformed');
            const cd = await readAt(handle, cdOffset, cdSize);
            const entries = [];
            const seen = new Set();
            let p = 0;
            for (let i = 0; i < total; i += 1) {
              if (p + 46 > cd.length || cd.readUInt32LE(p) !== 0x02014b50) refuse('the zip central directory is malformed');
              const entry = {
                madeBy: cd.readUInt16LE(p + 4),
                flags: cd.readUInt16LE(p + 8),
                method: cd.readUInt16LE(p + 10),
                crc: cd.readUInt32LE(p + 16),
                compressedSize: cd.readUInt32LE(p + 20),
                size: cd.readUInt32LE(p + 24),
                diskStart: cd.readUInt16LE(p + 34),
                external: cd.readUInt32LE(p + 38),
                offset: cd.readUInt32LE(p + 42),
              };
              const nameLength = cd.readUInt16LE(p + 28);
              const end = p + 46 + nameLength + cd.readUInt16LE(p + 30) + cd.readUInt16LE(p + 32);
              if (end > cd.length) refuse('the zip central directory is malformed');
              entry.rawName = cd.subarray(p + 46, p + 46 + nameLength);
              const why = nameRefusal(entry.rawName, s.members, seen);
              if (why !== null) refuse(why);
              entry.name = entry.rawName.toString('utf8');
              seen.add(entry.name);
              if ((entry.flags & 0x2041) !== 0) refuse('entry ' + entry.name + ' is encrypted');
              if (entry.method !== 0 && entry.method !== 8) refuse('entry ' + entry.name + ' uses an unsupported compression method');
              if (entry.compressedSize === 0xffffffff || entry.size === 0xffffffff || entry.offset === 0xffffffff || entry.diskStart !== 0) {
                refuse('zip64 archives are not accepted');
              }
              const host = entry.madeBy >>> 8;
              const unixType = (entry.external >>> 16) & 0o170000;
              if (host === 3 && unixType !== 0 && unixType !== 0o100000) refuse('entry ' + entry.name + ' is not a regular file');
              if (host !== 3 && host !== 0) refuse('entry ' + entry.name + ' was made on a system whose file types are not checked');
              if ((entry.external & 0x10) !== 0) refuse('entry ' + entry.name + ' is a directory');
              if (entry.size > s.maxBytes) refuse('entry ' + entry.name + ' unpacks to ' + entry.size + ' bytes, over the limit of ' + s.maxBytes);
              if (entry.method === 0 && entry.compressedSize !== entry.size) refuse('entry ' + entry.name + ' has inconsistent sizes');
              if (entry.method === 8 && entry.compressedSize === 0) refuse('entry ' + entry.name + ' has inconsistent sizes');
              entries.push(entry);
              p = end;
            }
            if (p !== cd.length) refuse('the zip central directory is malformed');
            for (const entry of entries) {
              if (entry.offset + 30 > cdOffset) refuse('entry ' + entry.name + ' points outside the archive');
              const local = await readAt(handle, entry.offset, 30);
              const nameLength = local.readUInt16LE(26);
              const dataStart = entry.offset + 30 + nameLength + local.readUInt16LE(28);
              if (
                local.readUInt32LE(0) !== 0x04034b50 ||
                local.readUInt16LE(6) !== entry.flags ||
                local.readUInt16LE(8) !== entry.method ||
                dataStart + entry.compressedSize > cdOffset ||
                !(await readAt(handle, entry.offset + 30, nameLength)).equals(entry.rawName)
              ) {
                refuse('the local header of entry ' + entry.name + ' does not match the central directory');
              }
              if ((entry.flags & 0x8) === 0) {
                if (local.readUInt32LE(14) !== entry.crc || local.readUInt32LE(18) !== entry.compressedSize || local.readUInt32LE(22) !== entry.size) {
                  refuse('the local header of entry ' + entry.name + ' does not match the central directory');
                }
              }
              entry.dataStart = dataStart;
            }
            return entries;
          }

          async function extract(handle, entry, into) {
            const target = path.join(into, entry.name);
            const flags = fs.constants.O_WRONLY | fs.constants.O_CREAT | fs.constants.O_EXCL | fs.constants.O_NOFOLLOW;
            const out = await fsp.open(target, flags, 0o600);
            let written = 0;
            let crc = 0;
            const count = new Transform({
              transform(chunk, _encoding, done) {
                written += chunk.length;
                if (written > entry.size) {
                  done(new Refusal('entry ' + entry.name + ' unpacks to more than the ' + entry.size + ' bytes it declares'));
                  return;
                }
                crc = crc32(chunk, crc);
                done(null, chunk);
              },
            });
            if (entry.compressedSize === 0) {
              await out.close();
            } else {
              const source = handle.createReadStream({ start: entry.dataStart, end: entry.dataStart + entry.compressedSize - 1, autoClose: false });
              const stages = entry.method === 8 ? [source, zlib.createInflateRaw(), count] : [source, count];
              await pipeline(...stages, out.createWriteStream());
            }
            if (written !== entry.size || crc !== entry.crc) refuse('entry ' + entry.name + ' does not match its declared size and checksum');
          }

          async function main() {
            const s = settings(process.env);
            const zipPath = s.into + '.zip';
            let created = false;
            try {
              const id = await findArtifact(s);
              await download(s, id, zipPath);
              const handle = await fsp.open(zipPath, 'r');
              try {
                const entries = await readEntries(handle, s);
                // A fresh directory: mkdir refuses one that already exists.
                await fsp.mkdir(s.into, { mode: 0o700 });
                created = true;
                for (const entry of entries) await extract(handle, entry, s.into);
              } finally {
                await handle.close();
              }
              console.log('usabl: fetched ' + s.members.join(', ') + ' from artifact ' + s.name + ' into ' + s.into);
            } catch (error) {
              if (created) await fsp.rm(s.into, { recursive: true, force: true });
              throw error;
            } finally {
              await fsp.rm(zipPath, { force: true });
            }
          }

          main().catch((error) => {
            const what = error instanceof Refusal ? error.message : 'the fetch failed: ' + (error instanceof Error ? error.message : String(error));
            console.error('usabl: refusing the ' + (process.env.ARTIFACT_NAME || '') + ' artifact: ' + what + '; failing closed');
            process.exit(1);
          });
          NODE

      - name: Fetch, verify, and unpack the trusted engine
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: usabl-engine
          ARTIFACT_MEMBERS: usabl-engine.tgz
          ARTIFACT_RUN_ID: ${{ github.run_id }}
          ARTIFACT_MAX_BYTES: "536870912"
          ARTIFACT_INTO: ${{ runner.temp }}/usabl-download-engine
          ENGINE_DIGEST: ${{ needs.usabl-engine.outputs.engine_digest }}
          DOWNLOAD_DIR: ${{ runner.temp }}/usabl-download-engine
        run: |
          node "${RUNNER_TEMP}/usabl-fetch-artifact.cjs"
          if ! [[ "${ENGINE_DIGEST}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "the expected engine digest is not a sha256 hex string; failing closed"
            exit 1
          fi
          if [ "$(ls -A "${DOWNLOAD_DIR}")" != "usabl-engine.tgz" ] || [ -L "${DOWNLOAD_DIR}/usabl-engine.tgz" ] || [ ! -f "${DOWNLOAD_DIR}/usabl-engine.tgz" ]; then
            echo "the engine artifact is not exactly one regular file named usabl-engine.tgz; failing closed"
            exit 1
          fi
          printf '%s  %s\n' "${ENGINE_DIGEST}" "${DOWNLOAD_DIR}/usabl-engine.tgz" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/usabl-engine"
          tar --extract --gzip --no-same-owner --file "${DOWNLOAD_DIR}/usabl-engine.tgz" --directory "${RUNNER_TEMP}/usabl-engine"

      - name: Fetch Result JSON
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: usabl-result
          ARTIFACT_MEMBERS: usabl-result.json
          ARTIFACT_RUN_ID: ${{ github.run_id }}
          ARTIFACT_MAX_BYTES: "67108864"
          ARTIFACT_INTO: ${{ runner.temp }}/usabl-download-result
        run: |
          node "${RUNNER_TEMP}/usabl-fetch-artifact.cjs"

      - name: Enforce policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT_DIGEST: ${{ needs.usabl-scan.outputs.result_digest }}
          DOWNLOAD_DIR: ${{ runner.temp }}/usabl-download-result
        run: |
          # The Result on stdin is consumed only for the exit-4 crash short-circuit, never to skip
          # owners, and only after it matches the judge's result_digest output.
          if ! [[ "${RESULT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "the expected Result digest is not a sha256 hex string; failing closed"
            exit 1
          fi
          if [ "$(ls -A "${DOWNLOAD_DIR}")" != "usabl-result.json" ] || [ -L "${DOWNLOAD_DIR}/usabl-result.json" ] || [ ! -f "${DOWNLOAD_DIR}/usabl-result.json" ]; then
            echo "the Result artifact is not exactly one regular file named usabl-result.json; failing closed"
            exit 1
          fi
          printf '%s  %s\n' "${RESULT_DIGEST}" "${DOWNLOAD_DIR}/usabl-result.json" | sha256sum -c -
          # Git refs and CODEOWNERS are the source of truth.
          if ! [[ "${ENGINE_TREE_DIGEST}" =~ ^[0-9a-f]{64}$ ]] || [ "$(cd "${RUNNER_TEMP}/usabl-engine" && { find . -mindepth 1 -printf '%y %p %l\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum; } | sha256sum | cut -d' ' -f1)" != "${ENGINE_TREE_DIGEST}" ]; then
            echo "the trusted engine tree is not the one the engine job packed; failing closed"
            exit 1
          fi
          node "${RUNNER_TEMP}/usabl-engine/dist/cli.js" enforce policy --trusted-ref "${BASE_SHA}" < "${DOWNLOAD_DIR}/usabl-result.json"

  usabl-required:
    # THE REQUIRED STATUS CHECK. Require this one in branch protection or your ruleset.
    #
    # Requiring any other job leaves a hole. usabl-scan holds the accessibility verdict as data
    # but can succeed with a failing verdict on a cancelled run, and usabl-policy returns success
    # whenever no guarded path diverged, which says nothing about accessibility. Only this job
    # checks every job's shape for the event and the judge's verdict together.
    #
    # always() is load-bearing. GitHub counts a skipped job as a satisfied required check, so
    # an aggregate that could be skipped would be an open gate. This one always runs and
    # always decides.
    needs: [usabl-engine, build-app, usabl-scan, gate-comment, usabl-policy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Decide the merge gate
        working-directory: ${{ runner.temp }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          ENGINE_RESULT: ${{ needs.usabl-engine.result }}
          BUILD_RESULT: ${{ needs.build-app.result }}
          SCAN_RESULT: ${{ needs.usabl-scan.result }}
          COMMENT_RESULT: ${{ needs.gate-comment.result }}
          POLICY_RESULT: ${{ needs.usabl-policy.result }}
          ACCESSIBILITY_VERDICT: ${{ needs.usabl-scan.outputs.verdict }}
        run: |
          node <<'NODE'
          const event = process.env.EVENT_NAME || '';
          const results = {
            'usabl-engine': process.env.ENGINE_RESULT || '',
            'build-app': process.env.BUILD_RESULT || '',
            'usabl-scan': process.env.SCAN_RESULT || '',
            'gate-comment': process.env.COMMENT_RESULT || '',
            'usabl-policy': process.env.POLICY_RESULT || '',
          };
          const accessibility = process.env.ACCESSIBILITY_VERDICT || '';
          const blockers = [];

          // The exact shape each event must produce. build-app runs pull request code, so it is fenced to
          // pull_request, and gate-comment only comments on pull_request. On a review both must have been
          // skipped by that fence; the judge re-judges the same head without running its code.
          const shapes = {
            pull_request: {
              'usabl-engine': 'success',
              'build-app': 'success',
              'usabl-scan': 'success',
              'gate-comment': 'success',
              'usabl-policy': 'success',
            },
            pull_request_review: {
              'usabl-engine': 'success',
              'build-app': 'skipped',
              'usabl-scan': 'success',
              'gate-comment': 'skipped',
              'usabl-policy': 'success',
            },
          };

          const shape = Object.prototype.hasOwnProperty.call(shapes, event) ? shapes[event] : null;
          if (shape === null) {
            blockers.push('unexpected event ' + (event || 'none') + '; this gate reasons about pull_request and pull_request_review only');
          } else {
            for (const job of Object.keys(shape)) {
              if (results[job] !== shape[job]) {
                blockers.push('the ' + job + ' job was ' + (results[job] || 'none') + ' on this ' + event + ' event, and it must be ' + shape[job]);
              }
            }
          }

          // The accessibility verdict is the judge's job output, never inferred from a job status and never
          // read from an artifact. Only the exact string "pass" passes, so a missing, empty, or unreadable
          // verdict blocks.
          if (accessibility !== 'pass') {
            blockers.push('the accessibility verdict from the judge is not a pass (verdict: ' + (accessibility || 'none') + ')');
          }

          if (blockers.length > 0) {
            console.error('usabl required gate: NOT verified');
            for (const blocker of blockers) {
              console.error('  - ' + blocker);
            }
            process.exit(1);
          }
          console.log('usabl required gate: verified. Accessibility and policy both pass for this head.');
          NODE
