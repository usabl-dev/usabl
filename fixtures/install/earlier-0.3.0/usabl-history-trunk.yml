name: usabl-history

on:
  push:
    branches: ["trunk"]
  schedule:
    # A second scan of an unchanged main confirms a fix without waiting for the next merge.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One scan and one append at a time, so two records never race for the same parent commit.
concurrency:
  group: usabl-history
  cancel-in-progress: false

# The engine is built once, by the same job the pull request gate uses, and each later job checks
# the archive against that job's digest output before it runs it. The scan job runs application
# code, which on a hosted runner may be able to replace artifacts in the run, so the job that
# writes never runs an engine it did not check. No job unpacks an artifact with
# actions/download-artifact, whose zip extraction follows .. inside entry names; each uses usabl's
# own fetcher, which accepts only the expected file. No job uses a cache.
jobs:
  usabl-engine:
    # The trusted engine, built from the pinned commit and handed to every other job as a
    # digest-checked archive. It runs no pull request code. The engine repository is public, so
    # this job needs no token and a pull request from a fork runs the gate like any other.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      engine_digest: ${{ steps.pack.outputs.engine_digest }}
      engine_tree_digest: ${{ steps.pack.outputs.engine_tree_digest }}
    steps:
      - name: Checkout trusted usabl engine commit
        # A full commit SHA you trust. The pull request never chooses the engine that judges it.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: usabl-dev/usabl
          ref: PIN_TO_A_TRUSTED_USABL_COMMIT
          path: usabl-engine
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          # setup-node turns npm caching on by itself when package.json names npm. A cache can be
          # written by pull request code, so every job turns it off by name.
          package-manager-cache: false

      - name: Install and build trusted engine
        working-directory: usabl-engine
        run: |
          # A fresh npm cache under the runner temp directory, never one a pull request could seed.
          export npm_config_cache="${RUNNER_TEMP}/usabl-npm-cache"
          npm ci
          npm run build
          # Keep only what the engine needs at run time, so no later job runs npm for it.
          npm prune --omit=dev

      - name: Pack trusted engine
        id: pack
        working-directory: usabl-engine
        run: |
          # package.json, dist, and the production node_modules the lockfile pinned. The .git
          # directory and the sources stay out.
          tar --create --gzip --file "${RUNNER_TEMP}/usabl-engine.tgz" --exclude=.git --exclude=node_modules/.bin package.json dist node_modules
          echo "engine_digest=$(sha256sum "${RUNNER_TEMP}/usabl-engine.tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          # The digest of the tree a job gets when it unpacks this archive. Each trusted job checks
          # its unpacked engine against it right before it runs the engine.
          mkdir "${RUNNER_TEMP}/usabl-engine-tree"
          tar --extract --gzip --no-same-owner --file "${RUNNER_TEMP}/usabl-engine.tgz" --directory "${RUNNER_TEMP}/usabl-engine-tree"
          echo "engine_tree_digest=$(cd "${RUNNER_TEMP}/usabl-engine-tree" && { find . -mindepth 1 -printf '%y %p %l\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum; } | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload trusted engine
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usabl-engine
          path: ${{ runner.temp }}/usabl-engine.tgz
          if-no-files-found: error
          retention-days: 1


  history-scan:
    # Starts the application from main and scans every screen. It runs application code, so it
    # never gets write access. It writes the record to a file and nothing to git.
    if: github.ref == 'refs/heads/trunk'
    needs: usabl-engine
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only the artifact fetch uses this: it lists this run's artifacts and downloads the engine.
      actions: read
    env:
      ENGINE_TREE_DIGEST: ${{ needs.usabl-engine.outputs.engine_tree_digest }}
    steps:
      - name: Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          # setup-node turns npm caching on by itself when package.json names npm. A cache can be
          # written by pull request code, so every job turns it off by name.
          package-manager-cache: false

      - name: Write the artifact fetcher
        working-directory: ${{ runner.temp }}
        run: |
          # usabl's own artifact fetcher, Node builtins only. No trusted job extracts an artifact
          # with actions/download-artifact, whose zip extraction follows .. inside entry names.
          set -o noclobber
          cat > "${RUNNER_TEMP}/usabl-fetch-artifact.cjs" <<'NODE'
          'use strict';
          // usabl artifact fetcher. Node builtins only. It refuses an artifact rather than repair it.
          const fs = require('node:fs');
          const fsp = require('node:fs/promises');
          const path = require('node:path');
          const zlib = require('node:zlib');
          const { Readable, Transform } = require('node:stream');
          const { pipeline } = require('node:stream/promises');

          class Refusal extends Error {}
          function refuse(message) {
            throw new Refusal(message);
          }

          const CRC_TABLE = new Int32Array(256).map((_, n) => {
            let c = n;
            for (let k = 0; k < 8; k += 1) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
            return c;
          });
          function crc32(chunk, previous) {
            if (typeof zlib.crc32 === 'function') return zlib.crc32(chunk, previous);
            let c = previous ^ -1;
            for (let i = 0; i < chunk.length; i += 1) c = CRC_TABLE[(c ^ chunk[i]) & 0xff] ^ (c >>> 8);
            return (c ^ -1) >>> 0;
          }

          function isLoopback(hostname) {
            return hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '[::1]';
          }

          function settings(env) {
            const name = env.ARTIFACT_NAME || '';
            if (!/^[a-z0-9][a-z0-9-]*$/.test(name)) refuse('ARTIFACT_NAME is not a plain artifact name');
            const members = (env.ARTIFACT_MEMBERS || '').split(',');
            for (const member of members) {
              if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(member) || member.includes('..')) {
                refuse('ARTIFACT_MEMBERS must list plain file names');
              }
            }
            if (new Set(members).size !== members.length) refuse('ARTIFACT_MEMBERS lists a name twice');
            const runId = env.ARTIFACT_RUN_ID || '';
            if (!/^[0-9]+$/.test(runId)) refuse('ARTIFACT_RUN_ID is not a run id');
            const maxBytes = Number(env.ARTIFACT_MAX_BYTES);
            if (!Number.isSafeInteger(maxBytes) || maxBytes <= 0) refuse('ARTIFACT_MAX_BYTES is not a byte count');
            const into = env.ARTIFACT_INTO || '';
            if (!path.isAbsolute(into) || path.resolve(into) !== into) refuse('ARTIFACT_INTO is not a plain absolute path');
            const workspace = env.GITHUB_WORKSPACE || '';
            if (workspace !== '') {
              const relative = path.relative(path.resolve(workspace), into);
              if (relative === '' || (!relative.startsWith('..') && !path.isAbsolute(relative))) {
                refuse('ARTIFACT_INTO must be outside the workspace');
              }
            }
            let api;
            try {
              api = new URL(env.GITHUB_API_URL || 'https://api.github.com');
            } catch {
              refuse('GITHUB_API_URL is not a URL');
            }
            if (api.protocol !== 'https:' && !(api.protocol === 'http:' && isLoopback(api.hostname))) {
              refuse('GITHUB_API_URL must be https');
            }
            const repository = env.GITHUB_REPOSITORY || '';
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) refuse('GITHUB_REPOSITORY is not owner/name');
            const token = env.GH_TOKEN || '';
            if (token === '') refuse('GH_TOKEN is empty');
            return { name, members, runId, maxBytes, into, api, repository, token };
          }

          function apiUrl(s, pathname) {
            return new URL(s.api.href.replace(/\/$/, '') + pathname);
          }

          function apiHeaders(s) {
            return {
              Accept: 'application/vnd.github+json',
              Authorization: 'Bearer ' + s.token,
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'usabl',
            };
          }

          async function findArtifact(s) {
            const url = apiUrl(s, '/repos/' + s.repository + '/actions/runs/' + s.runId + '/artifacts?per_page=100&name=' + encodeURIComponent(s.name));
            const response = await fetch(url, { headers: apiHeaders(s), redirect: 'error' });
            if (!response.ok) refuse('GitHub answered ' + response.status + ' when listing the artifacts of run ' + s.runId);
            const listing = await response.json();
            const artifacts = listing !== null && typeof listing === 'object' && Array.isArray(listing.artifacts) ? listing.artifacts : [];
            // An artifact replaced in the run keeps its name and gets a new id, so the newest one is the one
            // the run holds now. Its content is checked against a job output after this.
            const found = artifacts
              .filter((a) => a !== null && typeof a === 'object' && a.name === s.name && a.expired !== true && Number.isSafeInteger(a.id))
              .sort((a, b) => b.id - a.id);
            if (found.length === 0) refuse('run ' + s.runId + ' has no artifact named ' + s.name);
            const artifact = found[0];
            if (typeof artifact.size_in_bytes === 'number' && artifact.size_in_bytes > s.maxBytes) {
              refuse('the artifact is ' + artifact.size_in_bytes + ' bytes, over the limit of ' + s.maxBytes);
            }
            return artifact.id;
          }

          async function download(s, id, zipPath) {
            const first = await fetch(apiUrl(s, '/repos/' + s.repository + '/actions/artifacts/' + id + '/zip'), {
              headers: apiHeaders(s),
              redirect: 'manual',
            });
            let response = first;
            if (first.status >= 300 && first.status < 400) {
              const location = first.headers.get('location');
              if (location === null) refuse('GitHub redirected the artifact download nowhere');
              const target = new URL(location, s.api);
              if (target.protocol !== 'https:' && !(target.protocol === 'http:' && s.api.protocol === 'http:' && isLoopback(target.hostname))) {
                refuse('the artifact download was redirected to a URL that is not https');
              }
              if (first.body !== null) await first.body.cancel();
              // The storage URL is signed. The job token is never sent to it.
              response = await fetch(target, { redirect: 'error' });
            }
            if (!response.ok || response.body === null) refuse('the artifact download answered ' + response.status);
            const declared = Number(response.headers.get('content-length'));
            if (Number.isFinite(declared) && declared > s.maxBytes) refuse('the artifact zip is over the limit of ' + s.maxBytes + ' bytes');
            const out = await fsp.open(zipPath, 'wx', 0o600);
            let total = 0;
            try {
              for await (const chunk of Readable.fromWeb(response.body)) {
                total += chunk.length;
                if (total > s.maxBytes) refuse('the artifact zip is over the limit of ' + s.maxBytes + ' bytes');
                await out.write(chunk);
              }
            } finally {
              await out.close();
            }
          }

          async function readAt(handle, offset, length) {
            const buffer = Buffer.alloc(length);
            const { bytesRead } = await handle.read(buffer, 0, length, offset);
            if (bytesRead !== length) refuse('the artifact zip ends early');
            return buffer;
          }

          // Why an entry name is refused, or null when it is exactly one of the expected members.
          function nameRefusal(raw, members, seen) {
            let name;
            try {
              name = new TextDecoder('utf-8', { fatal: true }).decode(raw);
            } catch {
              return 'an entry name is not UTF-8';
            }
            const shown = JSON.stringify(name);
            if (name === '' || name.includes('\0')) return 'an entry has an empty or NUL name';
            if (name.startsWith('/') || name.startsWith('\\') || /^[A-Za-z]:/.test(name)) return 'entry ' + shown + ' is an absolute path';
            if (name.split(/[\\/]/).includes('..')) return 'entry ' + shown + ' has a .. segment';
            if (name.includes('/') || name.includes('\\')) return 'entry ' + shown + ' is a path, not one of the expected file names';
            if (!members.includes(name)) return 'entry ' + shown + ' is not an expected member (' + members.join(', ') + ')';
            if (seen.has(name)) return 'entry ' + shown + ' appears twice';
            return null;
          }

          async function readEntries(handle, s) {
            const size = (await handle.stat()).size;
            if (size < 22) refuse('the artifact is not a zip archive');
            const tailLength = Math.min(size, 22 + 0xffff);
            const tailStart = size - tailLength;
            const tail = await readAt(handle, tailStart, tailLength);
            let eocd = -1;
            for (let i = tail.length - 22; i >= 0; i -= 1) {
              if (tail.readUInt32LE(i) === 0x06054b50 && i + 22 + tail.readUInt16LE(i + 20) === tail.length) {
                eocd = i;
                break;
              }
            }
            if (eocd === -1) refuse('the artifact is not a zip archive');
            const eocdOffset = tailStart + eocd;
            const disk = tail.readUInt16LE(eocd + 4);
            const cdDisk = tail.readUInt16LE(eocd + 6);
            const onDisk = tail.readUInt16LE(eocd + 8);
            const total = tail.readUInt16LE(eocd + 10);
            const cdSize = tail.readUInt32LE(eocd + 12);
            const cdOffset = tail.readUInt32LE(eocd + 16);
            if (total === 0xffff || cdSize === 0xffffffff || cdOffset === 0xffffffff) refuse('zip64 archives are not accepted');
            if (eocdOffset >= 20 && (await readAt(handle, eocdOffset - 20, 4)).readUInt32LE(0) === 0x07064b50) {
              refuse('zip64 archives are not accepted');
            }
            if (disk !== 0 || cdDisk !== 0 || onDisk !== total) refuse('split zip archives are not accepted');
            if (total !== s.members.length) {
              refuse('the artifact has ' + total + ' entries, and it must hold exactly ' + s.members.join(', '));
            }
            if (cdOffset + cdSize !== eocdOffset || cdSize > 1024 * total) refuse('the zip central directory is malformed');
            const cd = await readAt(handle, cdOffset, cdSize);
            const entries = [];
            const seen = new Set();
            let p = 0;
            for (let i = 0; i < total; i += 1) {
              if (p + 46 > cd.length || cd.readUInt32LE(p) !== 0x02014b50) refuse('the zip central directory is malformed');
              const entry = {
                madeBy: cd.readUInt16LE(p + 4),
                flags: cd.readUInt16LE(p + 8),
                method: cd.readUInt16LE(p + 10),
                crc: cd.readUInt32LE(p + 16),
                compressedSize: cd.readUInt32LE(p + 20),
                size: cd.readUInt32LE(p + 24),
                diskStart: cd.readUInt16LE(p + 34),
                external: cd.readUInt32LE(p + 38),
                offset: cd.readUInt32LE(p + 42),
              };
              const nameLength = cd.readUInt16LE(p + 28);
              const end = p + 46 + nameLength + cd.readUInt16LE(p + 30) + cd.readUInt16LE(p + 32);
              if (end > cd.length) refuse('the zip central directory is malformed');
              entry.rawName = cd.subarray(p + 46, p + 46 + nameLength);
              const why = nameRefusal(entry.rawName, s.members, seen);
              if (why !== null) refuse(why);
              entry.name = entry.rawName.toString('utf8');
              seen.add(entry.name);
              if ((entry.flags & 0x2041) !== 0) refuse('entry ' + entry.name + ' is encrypted');
              if (entry.method !== 0 && entry.method !== 8) refuse('entry ' + entry.name + ' uses an unsupported compression method');
              if (entry.compressedSize === 0xffffffff || entry.size === 0xffffffff || entry.offset === 0xffffffff || entry.diskStart !== 0) {
                refuse('zip64 archives are not accepted');
              }
              const host = entry.madeBy >>> 8;
              const unixType = (entry.external >>> 16) & 0o170000;
              if (host === 3 && unixType !== 0 && unixType !== 0o100000) refuse('entry ' + entry.name + ' is not a regular file');
              if (host !== 3 && host !== 0) refuse('entry ' + entry.name + ' was made on a system whose file types are not checked');
              if ((entry.external & 0x10) !== 0) refuse('entry ' + entry.name + ' is a directory');
              if (entry.size > s.maxBytes) refuse('entry ' + entry.name + ' unpacks to ' + entry.size + ' bytes, over the limit of ' + s.maxBytes);
              if (entry.method === 0 && entry.compressedSize !== entry.size) refuse('entry ' + entry.name + ' has inconsistent sizes');
              if (entry.method === 8 && entry.compressedSize === 0) refuse('entry ' + entry.name + ' has inconsistent sizes');
              entries.push(entry);
              p = end;
            }
            if (p !== cd.length) refuse('the zip central directory is malformed');
            for (const entry of entries) {
              if (entry.offset + 30 > cdOffset) refuse('entry ' + entry.name + ' points outside the archive');
              const local = await readAt(handle, entry.offset, 30);
              const nameLength = local.readUInt16LE(26);
              const dataStart = entry.offset + 30 + nameLength + local.readUInt16LE(28);
              if (
                local.readUInt32LE(0) !== 0x04034b50 ||
                local.readUInt16LE(6) !== entry.flags ||
                local.readUInt16LE(8) !== entry.method ||
                dataStart + entry.compressedSize > cdOffset ||
                !(await readAt(handle, entry.offset + 30, nameLength)).equals(entry.rawName)
              ) {
                refuse('the local header of entry ' + entry.name + ' does not match the central directory');
              }
              if ((entry.flags & 0x8) === 0) {
                if (local.readUInt32LE(14) !== entry.crc || local.readUInt32LE(18) !== entry.compressedSize || local.readUInt32LE(22) !== entry.size) {
                  refuse('the local header of entry ' + entry.name + ' does not match the central directory');
                }
              }
              entry.dataStart = dataStart;
            }
            return entries;
          }

          async function extract(handle, entry, into) {
            const target = path.join(into, entry.name);
            const flags = fs.constants.O_WRONLY | fs.constants.O_CREAT | fs.constants.O_EXCL | fs.constants.O_NOFOLLOW;
            const out = await fsp.open(target, flags, 0o600);
            let written = 0;
            let crc = 0;
            const count = new Transform({
              transform(chunk, _encoding, done) {
                written += chunk.length;
                if (written > entry.size) {
                  done(new Refusal('entry ' + entry.name + ' unpacks to more than the ' + entry.size + ' bytes it declares'));
                  return;
                }
                crc = crc32(chunk, crc);
                done(null, chunk);
              },
            });
            if (entry.compressedSize === 0) {
              await out.close();
            } else {
              const source = handle.createReadStream({ start: entry.dataStart, end: entry.dataStart + entry.compressedSize - 1, autoClose: false });
              const stages = entry.method === 8 ? [source, zlib.createInflateRaw(), count] : [source, count];
              await pipeline(...stages, out.createWriteStream());
            }
            if (written !== entry.size || crc !== entry.crc) refuse('entry ' + entry.name + ' does not match its declared size and checksum');
          }

          async function main() {
            const s = settings(process.env);
            const zipPath = s.into + '.zip';
            let created = false;
            try {
              const id = await findArtifact(s);
              await download(s, id, zipPath);
              const handle = await fsp.open(zipPath, 'r');
              try {
                const entries = await readEntries(handle, s);
                // A fresh directory: mkdir refuses one that already exists.
                await fsp.mkdir(s.into, { mode: 0o700 });
                created = true;
                for (const entry of entries) await extract(handle, entry, s.into);
              } finally {
                await handle.close();
              }
              console.log('usabl: fetched ' + s.members.join(', ') + ' from artifact ' + s.name + ' into ' + s.into);
            } catch (error) {
              if (created) await fsp.rm(s.into, { recursive: true, force: true });
              throw error;
            } finally {
              await fsp.rm(zipPath, { force: true });
            }
          }

          main().catch((error) => {
            const what = error instanceof Refusal ? error.message : 'the fetch failed: ' + (error instanceof Error ? error.message : String(error));
            console.error('usabl: refusing the ' + (process.env.ARTIFACT_NAME || '') + ' artifact: ' + what + '; failing closed');
            process.exit(1);
          });
          NODE

      - name: Fetch, verify, and unpack the trusted engine
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: usabl-engine
          ARTIFACT_MEMBERS: usabl-engine.tgz
          ARTIFACT_RUN_ID: ${{ github.run_id }}
          ARTIFACT_MAX_BYTES: "536870912"
          ARTIFACT_INTO: ${{ runner.temp }}/usabl-download-engine
          ENGINE_DIGEST: ${{ needs.usabl-engine.outputs.engine_digest }}
          DOWNLOAD_DIR: ${{ runner.temp }}/usabl-download-engine
        run: |
          node "${RUNNER_TEMP}/usabl-fetch-artifact.cjs"
          if ! [[ "${ENGINE_DIGEST}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "the expected engine digest is not a sha256 hex string; failing closed"
            exit 1
          fi
          if [ "$(ls -A "${DOWNLOAD_DIR}")" != "usabl-engine.tgz" ] || [ -L "${DOWNLOAD_DIR}/usabl-engine.tgz" ] || [ ! -f "${DOWNLOAD_DIR}/usabl-engine.tgz" ]; then
            echo "the engine artifact is not exactly one regular file named usabl-engine.tgz; failing closed"
            exit 1
          fi
          printf '%s  %s\n' "${ENGINE_DIGEST}" "${DOWNLOAD_DIR}/usabl-engine.tgz" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/usabl-engine"
          tar --extract --gzip --no-same-owner --file "${DOWNLOAD_DIR}/usabl-engine.tgz" --directory "${RUNNER_TEMP}/usabl-engine"
          # This places the engine in ../usabl for an app whose lockfile installs usabl from file:../usabl.
          # An app that does not use that path never reads the folder, so for that app this step does
          # not change what npm ci installs or what the build makes.
          mkdir -p "${GITHUB_WORKSPACE}/../usabl"
          tar --extract --gzip --no-same-owner --file "${DOWNLOAD_DIR}/usabl-engine.tgz" --directory "${GITHUB_WORKSPACE}/../usabl"

      - name: Install Chromium for engine checks
        working-directory: ${{ runner.temp }}/usabl-engine
        run: |
          if ! [[ "${ENGINE_TREE_DIGEST}" =~ ^[0-9a-f]{64}$ ]] || [ "$(cd "${RUNNER_TEMP}/usabl-engine" && { find . -mindepth 1 -printf '%y %p %l\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum; } | sha256sum | cut -d' ' -f1)" != "${ENGINE_TREE_DIGEST}" ]; then
            echo "the trusted engine tree is not the one the engine job packed; failing closed"
            exit 1
          fi
          node node_modules/playwright/cli.js install --with-deps chromium

      - name: Allow the Chromium sandbox
        run: |
          # Ubuntu runners restrict unprivileged user namespaces through AppArmor, and the Chromium
          # sandbox needs them.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Read the app origin from usabl.config.json
        run: |
          # The scan reads appBaseUrl from this checkout of main, so the app starts on that origin,
          # never on a port this file assumes. Only an http origin on loopback with an explicit port
          # is taken, the same shape the judge needs. Anything else stops here.
          node <<'NODE'
          const fs = require('node:fs');
          const fail = (why) => {
            console.error('usabl-history: ' + why + '; failing closed');
            process.exit(1);
          };
          let config;
          try {
            config = JSON.parse(fs.readFileSync('usabl.config.json', 'utf8'));
          } catch {
            fail('usabl.config.json is missing or is not JSON');
          }
          const base = config !== null && typeof config === 'object' ? config.appBaseUrl : undefined;
          if (typeof base !== 'string') fail('usabl.config.json has no appBaseUrl string');
          let url;
          try {
            url = new URL(base);
          } catch {
            fail('appBaseUrl in usabl.config.json is not a URL');
          }
          if (url.protocol !== 'http:') fail('appBaseUrl in usabl.config.json must use http');
          if (!['127.0.0.1', 'localhost', '[::1]'].includes(url.hostname)) {
            fail('appBaseUrl in usabl.config.json must be a loopback host (127.0.0.1, localhost, or [::1])');
          }
          if (url.port === '') fail('appBaseUrl in usabl.config.json must name an explicit port');
          const host = url.hostname === '[::1]' ? '::1' : url.hostname;
          fs.appendFileSync(process.env.GITHUB_ENV, 'USABL_APP_HOST=' + host + '\n' + 'USABL_APP_PORT=' + url.port + '\n' + 'USABL_APP_ORIGIN=' + url.origin + '\n');
          console.log('usabl-history: the app starts on ' + url.origin + ', the origin of appBaseUrl');
          NODE

      - name: Start application on localhost
        run: |
          npm run dev -- --host "${USABL_APP_HOST}" --port "${USABL_APP_PORT}" > "${RUNNER_TEMP}/usabl-vite.log" 2>&1 &
          echo "VITE_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for application readiness
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "${USABL_APP_ORIGIN}" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "application did not start on ${USABL_APP_ORIGIN}"
          cat "${RUNNER_TEMP}/usabl-vite.log"
          exit 1

      - name: Scan main and write the history record
        run: |
          if ! [[ "${ENGINE_TREE_DIGEST}" =~ ^[0-9a-f]{64}$ ]] || [ "$(cd "${RUNNER_TEMP}/usabl-engine" && { find . -mindepth 1 -printf '%y %p %l\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum; } | sha256sum | cut -d' ' -f1)" != "${ENGINE_TREE_DIGEST}" ]; then
            echo "the trusted engine tree is not the one the engine job packed; failing closed"
            exit 1
          fi
          node "${RUNNER_TEMP}/usabl-engine/dist/cli.js" history record --out usabl-history-record.json

      - name: Stop application server
        if: always()
        run: |
          if [ -n "${VITE_PID:-}" ]; then
            kill "${VITE_PID}" || true
          fi

      - name: Upload the history record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usabl-history-record
          path: usabl-history-record.json
          if-no-files-found: error
          retention-days: 1

  history-append:
    # Adds the record to the usabl/history branch. It runs no application code and no npm, only the
    # checked engine, so it is the one job that may write. Pushes never force, so a record is never
    # lost. The record itself came from a job that ran application code; a forged record can only
    # make later runs stricter, never greener, because the history can only lower the debt a run
    # accepts.
    needs: [usabl-engine, history-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Only the artifact fetch uses this: it lists this run's artifacts and downloads them.
      actions: read
    env:
      ENGINE_TREE_DIGEST: ${{ needs.usabl-engine.outputs.engine_tree_digest }}
    steps:
      - name: Checkout main without running it
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          # setup-node turns npm caching on by itself when package.json names npm. A cache can be
          # written by pull request code, so every job turns it off by name.
          package-manager-cache: false

      - name: Write the artifact fetcher
        working-directory: ${{ runner.temp }}
        run: |
          # usabl's own artifact fetcher, Node builtins only. No trusted job extracts an artifact
          # with actions/download-artifact, whose zip extraction follows .. inside entry names.
          set -o noclobber
          cat > "${RUNNER_TEMP}/usabl-fetch-artifact.cjs" <<'NODE'
          'use strict';
          // usabl artifact fetcher. Node builtins only. It refuses an artifact rather than repair it.
          const fs = require('node:fs');
          const fsp = require('node:fs/promises');
          const path = require('node:path');
          const zlib = require('node:zlib');
          const { Readable, Transform } = require('node:stream');
          const { pipeline } = require('node:stream/promises');

          class Refusal extends Error {}
          function refuse(message) {
            throw new Refusal(message);
          }

          const CRC_TABLE = new Int32Array(256).map((_, n) => {
            let c = n;
            for (let k = 0; k < 8; k += 1) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
            return c;
          });
          function crc32(chunk, previous) {
            if (typeof zlib.crc32 === 'function') return zlib.crc32(chunk, previous);
            let c = previous ^ -1;
            for (let i = 0; i < chunk.length; i += 1) c = CRC_TABLE[(c ^ chunk[i]) & 0xff] ^ (c >>> 8);
            return (c ^ -1) >>> 0;
          }

          function isLoopback(hostname) {
            return hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '[::1]';
          }

          function settings(env) {
            const name = env.ARTIFACT_NAME || '';
            if (!/^[a-z0-9][a-z0-9-]*$/.test(name)) refuse('ARTIFACT_NAME is not a plain artifact name');
            const members = (env.ARTIFACT_MEMBERS || '').split(',');
            for (const member of members) {
              if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(member) || member.includes('..')) {
                refuse('ARTIFACT_MEMBERS must list plain file names');
              }
            }
            if (new Set(members).size !== members.length) refuse('ARTIFACT_MEMBERS lists a name twice');
            const runId = env.ARTIFACT_RUN_ID || '';
            if (!/^[0-9]+$/.test(runId)) refuse('ARTIFACT_RUN_ID is not a run id');
            const maxBytes = Number(env.ARTIFACT_MAX_BYTES);
            if (!Number.isSafeInteger(maxBytes) || maxBytes <= 0) refuse('ARTIFACT_MAX_BYTES is not a byte count');
            const into = env.ARTIFACT_INTO || '';
            if (!path.isAbsolute(into) || path.resolve(into) !== into) refuse('ARTIFACT_INTO is not a plain absolute path');
            const workspace = env.GITHUB_WORKSPACE || '';
            if (workspace !== '') {
              const relative = path.relative(path.resolve(workspace), into);
              if (relative === '' || (!relative.startsWith('..') && !path.isAbsolute(relative))) {
                refuse('ARTIFACT_INTO must be outside the workspace');
              }
            }
            let api;
            try {
              api = new URL(env.GITHUB_API_URL || 'https://api.github.com');
            } catch {
              refuse('GITHUB_API_URL is not a URL');
            }
            if (api.protocol !== 'https:' && !(api.protocol === 'http:' && isLoopback(api.hostname))) {
              refuse('GITHUB_API_URL must be https');
            }
            const repository = env.GITHUB_REPOSITORY || '';
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) refuse('GITHUB_REPOSITORY is not owner/name');
            const token = env.GH_TOKEN || '';
            if (token === '') refuse('GH_TOKEN is empty');
            return { name, members, runId, maxBytes, into, api, repository, token };
          }

          function apiUrl(s, pathname) {
            return new URL(s.api.href.replace(/\/$/, '') + pathname);
          }

          function apiHeaders(s) {
            return {
              Accept: 'application/vnd.github+json',
              Authorization: 'Bearer ' + s.token,
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'usabl',
            };
          }

          async function findArtifact(s) {
            const url = apiUrl(s, '/repos/' + s.repository + '/actions/runs/' + s.runId + '/artifacts?per_page=100&name=' + encodeURIComponent(s.name));
            const response = await fetch(url, { headers: apiHeaders(s), redirect: 'error' });
            if (!response.ok) refuse('GitHub answered ' + response.status + ' when listing the artifacts of run ' + s.runId);
            const listing = await response.json();
            const artifacts = listing !== null && typeof listing === 'object' && Array.isArray(listing.artifacts) ? listing.artifacts : [];
            // An artifact replaced in the run keeps its name and gets a new id, so the newest one is the one
            // the run holds now. Its content is checked against a job output after this.
            const found = artifacts
              .filter((a) => a !== null && typeof a === 'object' && a.name === s.name && a.expired !== true && Number.isSafeInteger(a.id))
              .sort((a, b) => b.id - a.id);
            if (found.length === 0) refuse('run ' + s.runId + ' has no artifact named ' + s.name);
            const artifact = found[0];
            if (typeof artifact.size_in_bytes === 'number' && artifact.size_in_bytes > s.maxBytes) {
              refuse('the artifact is ' + artifact.size_in_bytes + ' bytes, over the limit of ' + s.maxBytes);
            }
            return artifact.id;
          }

          async function download(s, id, zipPath) {
            const first = await fetch(apiUrl(s, '/repos/' + s.repository + '/actions/artifacts/' + id + '/zip'), {
              headers: apiHeaders(s),
              redirect: 'manual',
            });
            let response = first;
            if (first.status >= 300 && first.status < 400) {
              const location = first.headers.get('location');
              if (location === null) refuse('GitHub redirected the artifact download nowhere');
              const target = new URL(location, s.api);
              if (target.protocol !== 'https:' && !(target.protocol === 'http:' && s.api.protocol === 'http:' && isLoopback(target.hostname))) {
                refuse('the artifact download was redirected to a URL that is not https');
              }
              if (first.body !== null) await first.body.cancel();
              // The storage URL is signed. The job token is never sent to it.
              response = await fetch(target, { redirect: 'error' });
            }
            if (!response.ok || response.body === null) refuse('the artifact download answered ' + response.status);
            const declared = Number(response.headers.get('content-length'));
            if (Number.isFinite(declared) && declared > s.maxBytes) refuse('the artifact zip is over the limit of ' + s.maxBytes + ' bytes');
            const out = await fsp.open(zipPath, 'wx', 0o600);
            let total = 0;
            try {
              for await (const chunk of Readable.fromWeb(response.body)) {
                total += chunk.length;
                if (total > s.maxBytes) refuse('the artifact zip is over the limit of ' + s.maxBytes + ' bytes');
                await out.write(chunk);
              }
            } finally {
              await out.close();
            }
          }

          async function readAt(handle, offset, length) {
            const buffer = Buffer.alloc(length);
            const { bytesRead } = await handle.read(buffer, 0, length, offset);
            if (bytesRead !== length) refuse('the artifact zip ends early');
            return buffer;
          }

          // Why an entry name is refused, or null when it is exactly one of the expected members.
          function nameRefusal(raw, members, seen) {
            let name;
            try {
              name = new TextDecoder('utf-8', { fatal: true }).decode(raw);
            } catch {
              return 'an entry name is not UTF-8';
            }
            const shown = JSON.stringify(name);
            if (name === '' || name.includes('\0')) return 'an entry has an empty or NUL name';
            if (name.startsWith('/') || name.startsWith('\\') || /^[A-Za-z]:/.test(name)) return 'entry ' + shown + ' is an absolute path';
            if (name.split(/[\\/]/).includes('..')) return 'entry ' + shown + ' has a .. segment';
            if (name.includes('/') || name.includes('\\')) return 'entry ' + shown + ' is a path, not one of the expected file names';
            if (!members.includes(name)) return 'entry ' + shown + ' is not an expected member (' + members.join(', ') + ')';
            if (seen.has(name)) return 'entry ' + shown + ' appears twice';
            return null;
          }

          async function readEntries(handle, s) {
            const size = (await handle.stat()).size;
            if (size < 22) refuse('the artifact is not a zip archive');
            const tailLength = Math.min(size, 22 + 0xffff);
            const tailStart = size - tailLength;
            const tail = await readAt(handle, tailStart, tailLength);
            let eocd = -1;
            for (let i = tail.length - 22; i >= 0; i -= 1) {
              if (tail.readUInt32LE(i) === 0x06054b50 && i + 22 + tail.readUInt16LE(i + 20) === tail.length) {
                eocd = i;
                break;
              }
            }
            if (eocd === -1) refuse('the artifact is not a zip archive');
            const eocdOffset = tailStart + eocd;
            const disk = tail.readUInt16LE(eocd + 4);
            const cdDisk = tail.readUInt16LE(eocd + 6);
            const onDisk = tail.readUInt16LE(eocd + 8);
            const total = tail.readUInt16LE(eocd + 10);
            const cdSize = tail.readUInt32LE(eocd + 12);
            const cdOffset = tail.readUInt32LE(eocd + 16);
            if (total === 0xffff || cdSize === 0xffffffff || cdOffset === 0xffffffff) refuse('zip64 archives are not accepted');
            if (eocdOffset >= 20 && (await readAt(handle, eocdOffset - 20, 4)).readUInt32LE(0) === 0x07064b50) {
              refuse('zip64 archives are not accepted');
            }
            if (disk !== 0 || cdDisk !== 0 || onDisk !== total) refuse('split zip archives are not accepted');
            if (total !== s.members.length) {
              refuse('the artifact has ' + total + ' entries, and it must hold exactly ' + s.members.join(', '));
            }
            if (cdOffset + cdSize !== eocdOffset || cdSize > 1024 * total) refuse('the zip central directory is malformed');
            const cd = await readAt(handle, cdOffset, cdSize);
            const entries = [];
            const seen = new Set();
            let p = 0;
            for (let i = 0; i < total; i += 1) {
              if (p + 46 > cd.length || cd.readUInt32LE(p) !== 0x02014b50) refuse('the zip central directory is malformed');
              const entry = {
                madeBy: cd.readUInt16LE(p + 4),
                flags: cd.readUInt16LE(p + 8),
                method: cd.readUInt16LE(p + 10),
                crc: cd.readUInt32LE(p + 16),
                compressedSize: cd.readUInt32LE(p + 20),
                size: cd.readUInt32LE(p + 24),
                diskStart: cd.readUInt16LE(p + 34),
                external: cd.readUInt32LE(p + 38),
                offset: cd.readUInt32LE(p + 42),
              };
              const nameLength = cd.readUInt16LE(p + 28);
              const end = p + 46 + nameLength + cd.readUInt16LE(p + 30) + cd.readUInt16LE(p + 32);
              if (end > cd.length) refuse('the zip central directory is malformed');
              entry.rawName = cd.subarray(p + 46, p + 46 + nameLength);
              const why = nameRefusal(entry.rawName, s.members, seen);
              if (why !== null) refuse(why);
              entry.name = entry.rawName.toString('utf8');
              seen.add(entry.name);
              if ((entry.flags & 0x2041) !== 0) refuse('entry ' + entry.name + ' is encrypted');
              if (entry.method !== 0 && entry.method !== 8) refuse('entry ' + entry.name + ' uses an unsupported compression method');
              if (entry.compressedSize === 0xffffffff || entry.size === 0xffffffff || entry.offset === 0xffffffff || entry.diskStart !== 0) {
                refuse('zip64 archives are not accepted');
              }
              const host = entry.madeBy >>> 8;
              const unixType = (entry.external >>> 16) & 0o170000;
              if (host === 3 && unixType !== 0 && unixType !== 0o100000) refuse('entry ' + entry.name + ' is not a regular file');
              if (host !== 3 && host !== 0) refuse('entry ' + entry.name + ' was made on a system whose file types are not checked');
              if ((entry.external & 0x10) !== 0) refuse('entry ' + entry.name + ' is a directory');
              if (entry.size > s.maxBytes) refuse('entry ' + entry.name + ' unpacks to ' + entry.size + ' bytes, over the limit of ' + s.maxBytes);
              if (entry.method === 0 && entry.compressedSize !== entry.size) refuse('entry ' + entry.name + ' has inconsistent sizes');
              if (entry.method === 8 && entry.compressedSize === 0) refuse('entry ' + entry.name + ' has inconsistent sizes');
              entries.push(entry);
              p = end;
            }
            if (p !== cd.length) refuse('the zip central directory is malformed');
            for (const entry of entries) {
              if (entry.offset + 30 > cdOffset) refuse('entry ' + entry.name + ' points outside the archive');
              const local = await readAt(handle, entry.offset, 30);
              const nameLength = local.readUInt16LE(26);
              const dataStart = entry.offset + 30 + nameLength + local.readUInt16LE(28);
              if (
                local.readUInt32LE(0) !== 0x04034b50 ||
                local.readUInt16LE(6) !== entry.flags ||
                local.readUInt16LE(8) !== entry.method ||
                dataStart + entry.compressedSize > cdOffset ||
                !(await readAt(handle, entry.offset + 30, nameLength)).equals(entry.rawName)
              ) {
                refuse('the local header of entry ' + entry.name + ' does not match the central directory');
              }
              if ((entry.flags & 0x8) === 0) {
                if (local.readUInt32LE(14) !== entry.crc || local.readUInt32LE(18) !== entry.compressedSize || local.readUInt32LE(22) !== entry.size) {
                  refuse('the local header of entry ' + entry.name + ' does not match the central directory');
                }
              }
              entry.dataStart = dataStart;
            }
            return entries;
          }

          async function extract(handle, entry, into) {
            const target = path.join(into, entry.name);
            const flags = fs.constants.O_WRONLY | fs.constants.O_CREAT | fs.constants.O_EXCL | fs.constants.O_NOFOLLOW;
            const out = await fsp.open(target, flags, 0o600);
            let written = 0;
            let crc = 0;
            const count = new Transform({
              transform(chunk, _encoding, done) {
                written += chunk.length;
                if (written > entry.size) {
                  done(new Refusal('entry ' + entry.name + ' unpacks to more than the ' + entry.size + ' bytes it declares'));
                  return;
                }
                crc = crc32(chunk, crc);
                done(null, chunk);
              },
            });
            if (entry.compressedSize === 0) {
              await out.close();
            } else {
              const source = handle.createReadStream({ start: entry.dataStart, end: entry.dataStart + entry.compressedSize - 1, autoClose: false });
              const stages = entry.method === 8 ? [source, zlib.createInflateRaw(), count] : [source, count];
              await pipeline(...stages, out.createWriteStream());
            }
            if (written !== entry.size || crc !== entry.crc) refuse('entry ' + entry.name + ' does not match its declared size and checksum');
          }

          async function main() {
            const s = settings(process.env);
            const zipPath = s.into + '.zip';
            let created = false;
            try {
              const id = await findArtifact(s);
              await download(s, id, zipPath);
              const handle = await fsp.open(zipPath, 'r');
              try {
                const entries = await readEntries(handle, s);
                // A fresh directory: mkdir refuses one that already exists.
                await fsp.mkdir(s.into, { mode: 0o700 });
                created = true;
                for (const entry of entries) await extract(handle, entry, s.into);
              } finally {
                await handle.close();
              }
              console.log('usabl: fetched ' + s.members.join(', ') + ' from artifact ' + s.name + ' into ' + s.into);
            } catch (error) {
              if (created) await fsp.rm(s.into, { recursive: true, force: true });
              throw error;
            } finally {
              await fsp.rm(zipPath, { force: true });
            }
          }

          main().catch((error) => {
            const what = error instanceof Refusal ? error.message : 'the fetch failed: ' + (error instanceof Error ? error.message : String(error));
            console.error('usabl: refusing the ' + (process.env.ARTIFACT_NAME || '') + ' artifact: ' + what + '; failing closed');
            process.exit(1);
          });
          NODE

      - name: Fetch, verify, and unpack the trusted engine
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: usabl-engine
          ARTIFACT_MEMBERS: usabl-engine.tgz
          ARTIFACT_RUN_ID: ${{ github.run_id }}
          ARTIFACT_MAX_BYTES: "536870912"
          ARTIFACT_INTO: ${{ runner.temp }}/usabl-download-engine
          ENGINE_DIGEST: ${{ needs.usabl-engine.outputs.engine_digest }}
          DOWNLOAD_DIR: ${{ runner.temp }}/usabl-download-engine
        run: |
          node "${RUNNER_TEMP}/usabl-fetch-artifact.cjs"
          if ! [[ "${ENGINE_DIGEST}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "the expected engine digest is not a sha256 hex string; failing closed"
            exit 1
          fi
          if [ "$(ls -A "${DOWNLOAD_DIR}")" != "usabl-engine.tgz" ] || [ -L "${DOWNLOAD_DIR}/usabl-engine.tgz" ] || [ ! -f "${DOWNLOAD_DIR}/usabl-engine.tgz" ]; then
            echo "the engine artifact is not exactly one regular file named usabl-engine.tgz; failing closed"
            exit 1
          fi
          printf '%s  %s\n' "${ENGINE_DIGEST}" "${DOWNLOAD_DIR}/usabl-engine.tgz" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/usabl-engine"
          tar --extract --gzip --no-same-owner --file "${DOWNLOAD_DIR}/usabl-engine.tgz" --directory "${RUNNER_TEMP}/usabl-engine"

      - name: Fetch the history record
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: usabl-history-record
          ARTIFACT_MEMBERS: usabl-history-record.json
          ARTIFACT_RUN_ID: ${{ github.run_id }}
          ARTIFACT_MAX_BYTES: "67108864"
          ARTIFACT_INTO: ${{ runner.temp }}/usabl-download-record
        run: |
          node "${RUNNER_TEMP}/usabl-fetch-artifact.cjs"

      - name: Append the record and push the history branch
        env:
          RECORD_PATH: ${{ runner.temp }}/usabl-download-record/usabl-history-record.json
        run: |
          # Fetch the branch fresh on every try, append on top of it, and push without force. A
          # push that loses a race is refused, so the loop fetches the newer branch and tries again.
          if ! [[ "${ENGINE_TREE_DIGEST}" =~ ^[0-9a-f]{64}$ ]] || [ "$(cd "${RUNNER_TEMP}/usabl-engine" && { find . -mindepth 1 -printf '%y %p %l\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum; } | sha256sum | cut -d' ' -f1)" != "${ENGINE_TREE_DIGEST}" ]; then
            echo "the trusted engine tree is not the one the engine job packed; failing closed"
            exit 1
          fi
          for attempt in 1 2 3; do
            git fetch --no-tags origin "+refs/heads/usabl/history:refs/remotes/origin/usabl/history" || echo "no usabl/history branch yet; the first record starts it"
            node "${RUNNER_TEMP}/usabl-engine/dist/cli.js" history append "${RECORD_PATH}"
            if git push origin "refs/heads/usabl/history:refs/heads/usabl/history"; then
              exit 0
            fi
            echo "push attempt ${attempt} was refused; fetching the newer history and trying again"
          done
          echo "could not push the history record after 3 attempts"
          exit 1
