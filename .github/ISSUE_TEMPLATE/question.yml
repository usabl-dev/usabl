name: Question
description: Ask how usabl works or how to use it
title: "question: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [documentation](https://usabl-dev.github.io/usabl/) first. If usabl gave a result you think is wrong, open a bug report instead.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Optional. What you are trying to do, the usabl version, and any command or output that helps.
    validations:
      required: false
