name: Feature request
description: Propose a new check, surface, or improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first. A clear problem makes it easier to agree on the right solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should usabl do? Include an example command, output, or rule if you can.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How usabl would prove it
      description: Optional. For a new check, say what evidence it would collect and how it avoids a false result.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Other ways to solve the problem, including tools you use today.
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
          required: false
