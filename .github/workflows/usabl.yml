# usabl CI

name: usabl

on:
  pull_request:
    branches: [main]
    # Default types omit `edited`. Retargeting a PR onto main must still run check.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # v5.1.0 declares node24 so GitHub stops forcing a Node 20 action onto Node 24.
        # Stay off checkout v7 (ESM plus fork-PR defaults we do not need).
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history so gitleaks can scan commits, not only the checkout snapshot.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Gitleaks
        run: |
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          # Pin the published checksum so a compromised or swapped release cannot run as CI.
          expected_sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" -o "${archive}"
          echo "${expected_sha256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          ./gitleaks detect --verbose --redact --exit-code 1

      - name: Pre-commit
        # Skip the pre-commit gitleaks hook: it scans the index, and CI has nothing staged.
        # The Gitleaks step above scans git history and is the merge gate.
        run: |
          python -m pip install --quiet pre-commit
          SKIP=gitleaks pre-commit run --all-files

      - name: Semgrep
        run: |
          python -m pip install --quiet 'semgrep==1.174.0'
          semgrep scan --config p/typescript --config p/javascript --config p/github-actions --config p/security-audit --error

      - name: Typecheck and test
        run: npm run check

      - name: Docs accessibility
        # usabl holds its own shipped HTML docs to the WCAG 2.2 AA bar it enforces
        # on other products. Chromium is already installed above.
        run: npm run docs:a11y

      - name: Docs link check
        # A broken docs link once shipped and was found by a person reading the docs, never by
        # CI, because this check existed as an npm script but no workflow ran it. Wire it so its
        # silence means it passed, not that it never ran.
        run: npm run docs:linkcheck

      - name: Docs badge check
        run: npm run docs:badges

  # Real Chromium suites gated by USABL_INTEGRATION. Default `npm run check` skips them, so a
  # merge could stay green while the live driver path drifted. This job runs only the in-repo
  # fixture suites (fixtures/live and local HTTP pages). The hero-bug / fixture-clean suites need
  # an external demo app path and stay local-only.
  integration-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Real Chromium integration
        run: npm run test:integration
